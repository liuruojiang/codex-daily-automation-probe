name: Microcap completed November4 close delivery recovery

# One-off branch only. The normal main workflow and all schedules stay intact.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: microcap-realtime-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out automation repository
        uses: actions/checkout@v6
        with:
          path: automation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check normal November4 delivery marker and all uncertain send evidence
        id: delivery_gate
        run: python -B automation/scripts/resume_completed_microcap_close_20261104.py gate
      - name: Check out unchanged approved runtime source only
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: 14b896a0915f700e5b999ff6c47676e6f8acaca1
          path: microcap
          sparse-checkout: |
            /*.py
            /scripts/
            /data/
          sparse-checkout-cone-mode: false
      - name: Install original source-reader dependencies
        run: python -m pip install numpy 'pandas<3' requests 'akshare==1.18.46' 'baostock==0.9.1' matplotlib
      - name: Verify authenticated completed close and fresh exact source difference
        id: prepared
        run: python -B -u automation/scripts/resume_completed_microcap_close_20261104.py prepare --root microcap --out artifacts
      - name: Recheck normal marker immediately before intent
        run: python -B automation/scripts/resume_completed_microcap_close_20261104.py gate
      - name: Persist normal-send intent before SMTP
        id: send_intent
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}-send-intent
          path: artifacts/metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Send Gmail
        id: send_gmail
        if: steps.prepared.outcome == 'success' && steps.send_intent.outcome == 'success'
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python -B automation/scripts/send_report.py artifacts/metadata.json --receipt artifacts/smtp-accepted.json
      - name: Preserve accepted SMTP receipt
        id: smtp_receipt
        if: steps.send_gmail.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}-smtp-accepted
          path: |
            artifacts/metadata.json
            artifacts/smtp-accepted.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare delivery marker
        if: steps.smtp_receipt.outcome == 'success'
        run: |
          mkdir -p delivery-marker
          printf '%s\n' "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > delivery-marker/run-url.txt
      - name: Mark digest delivered
        if: steps.smtp_receipt.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}
          path: delivery-marker/run-url.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload signal outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-realtime-digest
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
