name: Microcap Realtime Digest

on:
  schedule:
    # 11:30 Asia/Shanghai == 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Shanghai
      PLANNED_BJ: "11:30 Asia/Shanghai"
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
    steps:
      - name: Record workflow start time
        run: echo "STARTED_BJ=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Check out automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Check out microcap repository
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: main
          path: microcap

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib

      - name: Validate required realtime data secret
        run: |
          if [ -z "${QVERIS_API_KEY}" ]; then
            echo "Missing required GitHub Secret: QVERIS_API_KEY"
            exit 1
          fi

      - name: Clear stale realtime outputs
        working-directory: microcap
        run: |
          mkdir -p outputs
          rm -f realtime_signal_result.txt realtime_signal_v2_0_result.txt realtime_signal_v2_3_result.txt outputs/*_realtime_signal.csv

      - name: Run v2.0 realtime signal
        id: signals_v20
        working-directory: microcap
        shell: bash
        run: |
          set +e
          timeout --foreground 30m python -u microcap_top100_mom16_biweekly_live_v2_0.py "实时信号" 2>&1 | tee realtime_signal_v2_0_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_0_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Run v2.3 realtime signal
        id: signals_v23
        working-directory: microcap
        shell: bash
        run: |
          set +e
          timeout --foreground 30m python -u microcap_top100_mom16_biweekly_live_v2_3.py "实时信号" 2>&1 | tee realtime_signal_v2_3_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_3_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Build Markdown digest
        if: always()
        run: |
          python automation/scripts/build_microcap_realtime_digest.py \
            --result v2.0=microcap/realtime_signal_v2_0_result.txt \
            --result v2.3=microcap/realtime_signal_v2_3_result.txt \
            --out-dir artifacts \
            --planned "${PLANNED_BJ}" \
            --started "${STARTED_BJ}" \
            --exit-code "v2.0=${SIGNAL_V2_0_EXIT_CODE:-unknown}" \
            --exit-code "v2.3=${SIGNAL_V2_3_EXIT_CODE:-unknown}"

      - name: Send Gmail
        if: always()
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python automation/scripts/send_report.py artifacts/metadata.json

      - name: Upload signal outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-realtime-digest
          path: |
            artifacts/
            microcap/realtime_signal_v2_0_result.txt
            microcap/realtime_signal_v2_3_result.txt
            microcap/outputs/*_realtime_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Add realtime signal result to job summary
        if: always()
        run: |
          {
            echo "## Microcap realtime digest"
            echo
            echo "- Planned: ${PLANNED_BJ}"
            echo "- Started: ${STARTED_BJ}"
            echo "- v2.0 script exit code: ${{ steps.signals_v20.outputs.exit_code }}"
            echo "- v2.3 script exit code: ${{ steps.signals_v23.outputs.exit_code }}"
            echo "- Artifact: microcap-realtime-digest"
            echo
            echo "### v2.0"
            echo '```text'
            cat microcap/realtime_signal_v2_0_result.txt
            echo '```'
            echo
            echo "### v2.3"
            echo '```text'
            cat microcap/realtime_signal_v2_3_result.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when realtime signal script failed
        if: steps.signals_v20.outputs.exit_code != '0' || steps.signals_v23.outputs.exit_code != '0'
        run: exit 1
