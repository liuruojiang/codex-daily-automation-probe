name: Microcap Post-Close Digest

on:
  schedule:
    # 10:00 UTC is 18:00 Asia/Shanghai. The trading-day gate below suppresses
    # weekends and exchange holidays.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      correction:
        description: "Bypass the daily delivery marker and label this email as a corrected edition"
        required: false
        type: boolean
        default: false
      external_schedule:
        description: "Apply the trading-day and same-day guards used by an external scheduler"
        required: false
        type: boolean
        default: false
      publication_mode:
        description: "Use close_confirmed for the normal post-close digest; realtime remains manual-only"
        required: true
        type: choice
        options:
          - realtime
          - close_confirmed
        default: close_confirmed

permissions:
  contents: read
  actions: write

concurrency:
  group: microcap-realtime-digest
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/delivery-regression.yml
    with:
      family: microcap

  check-trading-day:
    runs-on: ubuntu-latest
    outputs:
      SHOULD_RUN_MICROCAP: ${{ steps.calendar.outputs.SHOULD_RUN_MICROCAP }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check A-share trading day
        id: calendar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3" "akshare==1.18.46"
          python - <<'PY' | tee calendar.env
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import akshare as ak
          import pandas as pd

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          should_run = False
          try:
              trade_dates = ak.tool_trade_date_hist_sina()
              dates = set(pd.to_datetime(trade_dates["trade_date"]).dt.date)
              if not dates or not min(dates) <= today <= max(dates):
                  raise ValueError("Trading calendar does not cover today's date")
              should_run = today in dates
          except Exception as exc:
              print(f"A_SHARE_CALENDAR_ERROR={type(exc).__name__}: {exc}")
              raise RuntimeError("Trading calendar unavailable; not a confirmed holiday") from exc
          print(f"A_SHARE_TODAY={today.isoformat()}")
          if should_run:
              print("SHOULD_RUN_MICROCAP=true")
          else:
              print("SHOULD_RUN_MICROCAP=false")
          PY
          cat calendar.env >> "$GITHUB_OUTPUT"

  send:
    needs: [check-trading-day, regression]
    if: always() && needs.regression.result == 'success' && needs.check-trading-day.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.external_schedule != true) || needs.check-trading-day.outputs.SHOULD_RUN_MICROCAP == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Shanghai
      PLANNED_BJ: "18:00 Asia/Shanghai"
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record workflow start time
        run: echo "STARTED_BJ=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Check out automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve publication mode
        id: publication_mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_mode || 'close_confirmed' }}
        run: python automation/scripts/resolve_cn_publication_mode.py --requested "${REQUESTED_MODE}"

      - name: Check delivery marker
        id: delivery_gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORRECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.correction && 'true' || 'false' }}
        run: |
          args=()
          if [[ "${CORRECTION}" == "true" ]]; then
            args+=(--correction)
          fi
          python automation/scripts/check_microcap_delivery.py --publication-mode "${{ steps.publication_mode.outputs.mode }}" "${args[@]}"

      - name: Check out microcap repository
        if: steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: 3d01422edd59f721e093eb8ccf46d8b24e3a4097
          path: microcap

      - name: Check out isolated v2.3 close-confirmed workspace
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.publication_mode.outputs.mode == 'close_confirmed'
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: 3d01422edd59f721e093eb8ccf46d8b24e3a4097
          path: microcap-v23

      - name: Check out isolated v2.5 close-confirmed workspace
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.publication_mode.outputs.mode == 'close_confirmed'
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: 3d01422edd59f721e093eb8ccf46d8b24e3a4097
          path: microcap-v25

      - name: Record microcap strategy SHA
        id: microcap_sha
        if: steps.delivery_gate.outputs.should_send == 'true'
        working-directory: microcap
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install runtime dependencies
        if: steps.delivery_gate.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "pandas<3" requests "akshare==1.18.46" matplotlib

      - name: Restore persistent full rebalance cache
        id: full_cache_restore
        if: steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/cache/restore@v4
        with:
          path: microcap/.microcap_index_cache
          key: microcap-full-rebalance-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            microcap-full-rebalance-v1-${{ runner.os }}-

      - name: Bootstrap full rebalance cache on cold start
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.full_cache_restore.outputs.cache-matched-key == ''
        shell: bash
        env:
          CACHE_URL: https://github.com/liuruojiang/microcap/releases/download/microcap-full-rebalance-cache-v1-20260903/microcap-full-rebalance-cache-v1-20260903.zip
          CACHE_SHA256: ecee736f9bb35ac4b43a63e4fd7c83b0a4e9d8c94903f2631b5763a4e1d46686
        run: |
          cache_bundle="${RUNNER_TEMP}/microcap-full-rebalance-cache-v1.zip"
          curl --fail --location --retry 4 --retry-all-errors --output "${cache_bundle}" "${CACHE_URL}"
          echo "${CACHE_SHA256}  ${cache_bundle}" | sha256sum --check --strict
          python microcap/scripts/full_rebalance_cache_bundle.py restore \
            --root microcap \
            --bundle "${cache_bundle}" \
            --min-symbols 4500

      - name: Validate full rebalance cache
        id: full_cache
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          set +e
          python microcap/scripts/full_rebalance_cache_bundle.py validate \
            --root microcap \
            --min-symbols 4500 2>&1 | tee microcap/full_rebalance_cache_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Clear stale signal outputs
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          for root in microcap microcap-v23 microcap-v25; do
            [[ -d "${root}" ]] || continue
            mkdir -p "${root}/outputs"
            rm -f "${root}"/realtime_state_refresh_result.txt "${root}"/realtime_signal_result.txt "${root}"/realtime_signal_v2_0_result.txt "${root}"/realtime_signal_v2_3_result.txt "${root}"/realtime_signal_v2_5_result.txt "${root}"/outputs/*_realtime_signal.csv "${root}"/outputs/*_latest_signal.csv
          done

      - name: Refresh Top100 realtime state
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.full_cache.outputs.exit_code == '0'
        id: refresh_state
        working-directory: microcap
        shell: bash
        run: |
          set +e
          status=1
          : > realtime_state_refresh_result.txt
          for attempt in 1 2 3; do
            echo "refresh_attempt=${attempt}/3" | tee -a realtime_state_refresh_result.txt
            timeout --foreground 22m python -u scripts/realtime_state_bundle.py refresh \
              --root . \
              --max-workers 1 \
              --force-refresh-static-inputs \
              --max-anchor-age-days 3 2>&1 | tee -a realtime_state_refresh_result.txt
            status=${PIPESTATUS[0]}
            if [[ "${status}" -eq 0 ]]; then
              break
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 20))
            fi
          done
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "REFRESH_STATE_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Record refresh failure for digest
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && (steps.full_cache.outcome != 'success' || steps.full_cache.outputs.exit_code != '0' || steps.refresh_state.outcome != 'success' || steps.refresh_state.outputs.exit_code != '0')
        shell: bash
        run: |
          cache_exit="${{ steps.full_cache.outputs.exit_code }}"
          refresh_exit="${{ steps.refresh_state.outputs.exit_code }}"
          for item in "microcap:v2_0" "microcap-v23:v2_3" "microcap-v25:v2_5"; do
            root="${item%%:*}"
            version="${item##*:}"
            [[ -d "${root}" ]] || root=microcap
            cat > "${root}/realtime_signal_${version}_result.txt" <<EOF
          preflight_failed
          full_cache_exit_code: ${cache_exit:-not_run}
          refresh_exit_code: ${refresh_exit:-not_run}
          reason: Top100 full-cache validation or state refresh failed, so the ${version} signal was not run.
          refresh_log: microcap/realtime_state_refresh_result.txt
          EOF
          done

      - name: Pack validated production state
        id: state_bundle
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.refresh_state.outcome == 'success' && steps.refresh_state.outputs.exit_code == '0'
        shell: bash
        run: |
          python microcap/scripts/realtime_state_bundle.py pack \
            --root microcap \
            --bundle "${RUNNER_TEMP}/microcap-top100-state.zip" \
            --max-anchor-age-days 3

      - name: Restore state into isolated v2.3 workspace
        id: restore_v23
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.publication_mode.outputs.mode == 'close_confirmed' && steps.state_bundle.outcome == 'success'
        shell: bash
        run: |
          python microcap/scripts/realtime_state_bundle.py restore \
            --root microcap-v23 \
            --bundle "${RUNNER_TEMP}/microcap-top100-state.zip" \
            --max-anchor-age-days 3

      - name: Restore state into isolated v2.5 workspace
        id: restore_v25
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.publication_mode.outputs.mode == 'close_confirmed' && steps.state_bundle.outcome == 'success'
        shell: bash
        run: |
          python microcap/scripts/realtime_state_bundle.py restore \
            --root microcap-v25 \
            --bundle "${RUNNER_TEMP}/microcap-top100-state.zip" \
            --max-anchor-age-days 3

      - name: Save refreshed full rebalance cache
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: microcap/.microcap_index_cache
          key: microcap-full-rebalance-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Run v2.0 selected signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success'
        id: signals_v20
        working-directory: microcap
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          query=$(python -c 'print("\u4fe1\u53f7" if "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" else "\u5b9e\u65f6\u4fe1\u53f7")')
          timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_0.py "${query}" 2>&1 | tee realtime_signal_v2_0_result.txt
          status=${PIPESTATUS[0]}
          if [[ "${status}" -eq 0 && "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            # Cold runners have no previous costed NAV. Re-run the same frozen inputs
            # to require a clean historical-rewrite audit before whole-delivery packing.
            timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_0.py "${query}" 2>&1 | tee -a realtime_signal_v2_0_result.txt
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_0_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Run v2.3 selected signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.restore_v23.outcome == 'success')
        id: signals_v23
        working-directory: ${{ steps.publication_mode.outputs.mode == 'close_confirmed' && 'microcap-v23' || 'microcap' }}
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          query=$(python -c 'print("\u4fe1\u53f7" if "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" else "\u5b9e\u65f6\u4fe1\u53f7")')
          timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_3.py "${query}" 2>&1 | tee realtime_signal_v2_3_result.txt
          status=${PIPESTATUS[0]}
          if [[ "${status}" -eq 0 && "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            # Cold runners have no previous costed NAV. Re-run the same frozen inputs
            # to require a clean historical-rewrite audit before whole-delivery packing.
            timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_3.py "${query}" 2>&1 | tee -a realtime_signal_v2_3_result.txt
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_3_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Run v2.5 selected signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.restore_v25.outcome == 'success')
        id: signals_v25
        working-directory: ${{ steps.publication_mode.outputs.mode == 'close_confirmed' && 'microcap-v25' || 'microcap' }}
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          query=$(python -c 'print("\u4fe1\u53f7" if "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" else "\u5b9e\u65f6\u4fe1\u53f7")')
          timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_5.py "${query}" 2>&1 | tee realtime_signal_v2_5_result.txt
          status=${PIPESTATUS[0]}
          if [[ "${status}" -eq 0 && "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            # Cold runners have no previous costed NAV. Re-run the same frozen inputs
            # to require a clean historical-rewrite audit before whole-delivery packing.
            timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_5.py "${query}" 2>&1 | tee -a realtime_signal_v2_5_result.txt
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_5_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Verify and pack all three final deliveries
        id: whole_delivery
        if: always() && steps.publication_mode.outputs.mode == 'close_confirmed' && steps.signals_v20.outputs.exit_code == '0' && steps.signals_v23.outputs.exit_code == '0' && steps.signals_v25.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python microcap/scripts/top100_cloud_delivery.py pack \
            --root microcap --v23-root microcap-v23 --v25-root microcap-v25 \
            --expected-date "${{ steps.delivery_gate.outputs.delivery_date }}" \
            --bundle "${RUNNER_TEMP}/microcap-whole-delivery-state.zip" 2>&1 | tee microcap/whole_delivery_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" != "0" ]]; then
            for version in 0 3 5; do
              echo "SIGNAL_V2_${version}_EXIT_CODE=whole_delivery_failed" >> "${GITHUB_ENV}"
            done
          fi
          exit 0

      - name: Build Markdown digest
        id: digest
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          signal_suffix=realtime_signal
          v23_root=microcap
          v25_root=microcap
          if [[ "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            signal_suffix=latest_signal
            v23_root=microcap-v23
            v25_root=microcap-v25
          fi
          python automation/scripts/build_microcap_realtime_digest.py \
            --result v2.0=microcap/realtime_signal_v2_0_result.txt \
            --result v2.3=${v23_root}/realtime_signal_v2_3_result.txt \
            --result v2.5=${v25_root}/realtime_signal_v2_5_result.txt \
            --signal-csv v2.0=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_0_${signal_suffix}.csv \
            --signal-csv v2.3=${v23_root}/outputs/microcap_top100_mom16_biweekly_live_v2_3_${signal_suffix}.csv \
            --signal-csv v2.5=${v25_root}/outputs/microcap_top100_mom16_biweekly_live_v2_5_${signal_suffix}.csv \
            --out-dir artifacts \
            --publication-mode "${{ steps.publication_mode.outputs.mode }}" \
            --expected-signal-date "${{ (github.event_name == 'schedule' || inputs.external_schedule == true) && steps.delivery_gate.outputs.delivery_date || '' }}" \
            --planned "${PLANNED_BJ}" \
            --started "${STARTED_BJ}" \
            --strategy-sha "${{ steps.microcap_sha.outputs.sha }}" \
            --subject-prefix "${{ steps.delivery_gate.outputs.subject_prefix }}" \
            --exit-code "v2.0=${SIGNAL_V2_0_EXIT_CODE:-unknown}" \
            --exit-code "v2.3=${SIGNAL_V2_3_EXIT_CODE:-unknown}" \
            --exit-code "v2.5=${SIGNAL_V2_5_EXIT_CODE:-unknown}"
          digest_status=$(python -c 'import json; print(json.load(open("artifacts/metadata.json", encoding="utf-8"))["status"])')
          echo "status=${digest_status}" >> "${GITHUB_OUTPUT}"

      - name: Persist normal-send intent before SMTP
        id: send_intent
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.digest.outputs.status == 'OK' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.exit_code == '0')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}-send-intent
          path: artifacts/metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Send Gmail
        id: send_gmail
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.digest.outcome == 'success' && (steps.digest.outputs.status != 'OK' || (steps.send_intent.outcome == 'success' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.exit_code == '0')))
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python automation/scripts/send_report.py artifacts/metadata.json

      - name: Prepare delivery marker
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.send_gmail.outcome == 'success' && steps.digest.outputs.status == 'OK' && steps.signals_v20.outputs.exit_code == '0' && steps.signals_v23.outputs.exit_code == '0' && steps.signals_v25.outputs.exit_code == '0' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.exit_code == '0')
        shell: bash
        run: |
          mkdir -p delivery-marker
          printf '%s\n' "${GITHUB_RUN_URL}" > delivery-marker/run-url.txt

      - name: Preserve verified whole delivery for the next trading day
        if: steps.whole_delivery.outputs.exit_code == '0' && steps.digest.outputs.status == 'OK' && steps.send_gmail.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-whole-delivery-state
          path: ${{ runner.temp }}/microcap-whole-delivery-state.zip
          if-no-files-found: error
          retention-days: 90

      - name: Mark digest delivered
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.send_gmail.outcome == 'success' && steps.digest.outputs.status == 'OK' && steps.signals_v20.outputs.exit_code == '0' && steps.signals_v23.outputs.exit_code == '0' && steps.signals_v25.outputs.exit_code == '0' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.exit_code == '0')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}
          path: delivery-marker/run-url.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload signal outputs
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-realtime-digest
          path: |
            artifacts/
            microcap/full_rebalance_cache_result.txt
            microcap/realtime_state_refresh_result.txt
            microcap/whole_delivery_result.txt
            microcap/realtime_signal_v2_0_result.txt
            microcap/realtime_signal_v2_3_result.txt
            microcap/realtime_signal_v2_5_result.txt
            microcap/outputs/*_realtime_signal.csv
            microcap/outputs/*_latest_signal.csv
            microcap-v23/realtime_signal_v2_3_result.txt
            microcap-v23/outputs/*_latest_signal.csv
            microcap-v25/realtime_signal_v2_5_result.txt
            microcap-v25/outputs/*_latest_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Add signal result to job summary
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          v23_root=microcap
          v25_root=microcap
          if [[ "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            v23_root=microcap-v23
            v25_root=microcap-v25
          fi
          {
            echo "## Microcap signal digest"
            echo
            echo "- Publication mode: ${{ steps.publication_mode.outputs.mode }}"
            echo "- Publication mode basis: ${{ steps.publication_mode.outputs.basis }}"
            echo "- Resolved at: ${{ steps.publication_mode.outputs.beijing_time }}"
            echo "- Digest status: ${{ steps.digest.outputs.status }}"
            echo "- Planned: ${PLANNED_BJ}"
            echo "- Started: ${STARTED_BJ}"
            echo "- Refresh state exit code: ${{ steps.refresh_state.outputs.exit_code }}"
            echo "- v2.0 script exit code: ${{ steps.signals_v20.outputs.exit_code }}"
            echo "- v2.3 script exit code: ${{ steps.signals_v23.outputs.exit_code }}"
            echo "- v2.5 script exit code: ${{ steps.signals_v25.outputs.exit_code }}"
            echo "- Artifact: microcap-realtime-digest"
            echo
            echo "### Refresh"
            echo '```text'
            if [[ -f microcap/realtime_state_refresh_result.txt ]]; then
              cat microcap/realtime_state_refresh_result.txt
            else
              echo "Refresh did not run because an earlier preflight failed."
            fi
            echo '```'
            echo
            echo "### v2.0"
            echo '```text'
            cat microcap/realtime_signal_v2_0_result.txt
            echo '```'
            echo
            echo "### v2.3"
            echo '```text'
            cat "${v23_root}/realtime_signal_v2_3_result.txt"
            echo '```'
            echo
            echo "### v2.5"
            echo '```text'
            cat "${v25_root}/realtime_signal_v2_5_result.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when signal publication failed
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && (steps.digest.outputs.status != 'OK' || steps.signals_v20.outputs.exit_code != '0' || steps.signals_v23.outputs.exit_code != '0' || steps.signals_v25.outputs.exit_code != '0' || (steps.publication_mode.outputs.mode == 'close_confirmed' && steps.whole_delivery.outputs.exit_code != '0'))
        run: exit 1
