name: Microcap Realtime Digest

on:
  schedule:
    # Redundant off-minute triggers reduce exposure to delayed GitHub cron starts.
    - cron: "33 1 * * *"
    - cron: "48 1 * * *"
    - cron: "3 2 * * *"
  workflow_dispatch:
    inputs:
      correction:
        description: "Bypass the daily delivery marker and label this email as a corrected edition"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: microcap-realtime-digest
  cancel-in-progress: false

jobs:
  check-trading-day:
    runs-on: ubuntu-latest
    outputs:
      SHOULD_RUN_MICROCAP: ${{ steps.calendar.outputs.SHOULD_RUN_MICROCAP }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check A-share trading day
        id: calendar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3" "akshare==1.18.46"
          python - <<'PY' | tee calendar.env
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import akshare as ak
          import pandas as pd

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          should_run = False
          try:
              trade_dates = ak.tool_trade_date_hist_sina()
              dates = set(pd.to_datetime(trade_dates["trade_date"]).dt.date)
              should_run = today in dates
          except Exception as exc:
              print(f"A_SHARE_CALENDAR_ERROR={type(exc).__name__}: {exc}")
              should_run = False
          print(f"A_SHARE_TODAY={today.isoformat()}")
          if should_run:
              print("SHOULD_RUN_MICROCAP=true")
          else:
              print("SHOULD_RUN_MICROCAP=false")
          PY
          cat calendar.env >> "$GITHUB_OUTPUT"

  send:
    needs: check-trading-day
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check-trading-day.outputs.SHOULD_RUN_MICROCAP == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Shanghai
      PLANNED_BJ: "09:33/09:48/10:03 Asia/Shanghai"
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record workflow start time
        run: echo "STARTED_BJ=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Check out automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check delivery marker
        id: delivery_gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORRECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.correction && 'true' || 'false' }}
        run: |
          args=()
          if [[ "${CORRECTION}" == "true" ]]; then
            args+=(--correction)
          fi
          python automation/scripts/check_microcap_delivery.py "${args[@]}"

      - name: Check out microcap repository
        if: steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: 803675dccb9d9e739eaa1b759dfdb5e37f68e6e1
          path: microcap

      - name: Record microcap strategy SHA
        id: microcap_sha
        if: steps.delivery_gate.outputs.should_send == 'true'
        working-directory: microcap
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install runtime dependencies
        if: steps.delivery_gate.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "pandas<3" requests "akshare==1.18.46" matplotlib

      - name: Clear stale realtime outputs
        if: steps.delivery_gate.outputs.should_send == 'true'
        working-directory: microcap
        run: |
          mkdir -p outputs
          rm -f realtime_state_refresh_result.txt realtime_signal_result.txt realtime_signal_v2_0_result.txt realtime_signal_v2_3_result.txt realtime_signal_v2_5_result.txt outputs/*_realtime_signal.csv

      - name: Refresh Top100 realtime state
        if: steps.delivery_gate.outputs.should_send == 'true'
        id: refresh_state
        working-directory: microcap
        shell: bash
        run: |
          set +e
          timeout --foreground 60m python -u scripts/realtime_state_bundle.py refresh --root . --max-workers 1 2>&1 | tee realtime_state_refresh_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "REFRESH_STATE_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Record refresh failure for digest
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.refresh_state.outputs.exit_code != '0'
        working-directory: microcap
        shell: bash
        run: |
          for version in v2_0 v2_3 v2_5; do
            cat > "realtime_signal_${version}_result.txt" <<EOF
          preflight_failed
          refresh_exit_code: ${{ steps.refresh_state.outputs.exit_code }}
          reason: Top100 realtime state refresh failed, so the ${version} realtime signal was not run.
          refresh_log: microcap/realtime_state_refresh_result.txt
          EOF
          done

      - name: Run v2.0 realtime signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        id: signals_v20
        working-directory: microcap
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          timeout --foreground 8m python -u microcap_top100_mom16_biweekly_live_v2_0.py "实时信号" 2>&1 | tee realtime_signal_v2_0_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_0_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Run v2.3 realtime signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        id: signals_v23
        working-directory: microcap
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          timeout --foreground 8m python -u microcap_top100_mom16_biweekly_live_v2_3.py "实时信号" 2>&1 | tee realtime_signal_v2_3_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_3_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Run v2.5 realtime signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        id: signals_v25
        working-directory: microcap
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          timeout --foreground 8m python -u microcap_top100_mom16_biweekly_live_v2_5.py "实时信号" 2>&1 | tee realtime_signal_v2_5_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "SIGNAL_V2_5_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Build Markdown digest
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        run: |
          python automation/scripts/build_microcap_realtime_digest.py \
            --result v2.0=microcap/realtime_signal_v2_0_result.txt \
            --result v2.3=microcap/realtime_signal_v2_3_result.txt \
            --result v2.5=microcap/realtime_signal_v2_5_result.txt \
            --signal-csv v2.0=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_0_realtime_signal.csv \
            --signal-csv v2.3=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_3_realtime_signal.csv \
            --signal-csv v2.5=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_5_realtime_signal.csv \
            --out-dir artifacts \
            --planned "${PLANNED_BJ}" \
            --started "${STARTED_BJ}" \
            --strategy-sha "${{ steps.microcap_sha.outputs.sha }}" \
            --subject-prefix "${{ steps.delivery_gate.outputs.subject_prefix }}" \
            --exit-code "v2.0=${SIGNAL_V2_0_EXIT_CODE:-unknown}" \
            --exit-code "v2.3=${SIGNAL_V2_3_EXIT_CODE:-unknown}" \
            --exit-code "v2.5=${SIGNAL_V2_5_EXIT_CODE:-unknown}"

      - name: Send Gmail
        id: send_gmail
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python automation/scripts/send_report.py artifacts/metadata.json

      - name: Prepare delivery marker
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.send_gmail.outcome == 'success'
        shell: bash
        run: |
          mkdir -p delivery-marker
          printf '%s\n' "${GITHUB_RUN_URL}" > delivery-marker/run-url.txt

      - name: Mark digest delivered
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.send_gmail.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}
          path: delivery-marker/run-url.txt
          retention-days: 30

      - name: Upload signal outputs
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-realtime-digest
          path: |
            artifacts/
            microcap/realtime_state_refresh_result.txt
            microcap/realtime_signal_v2_0_result.txt
            microcap/realtime_signal_v2_3_result.txt
            microcap/realtime_signal_v2_5_result.txt
            microcap/outputs/*_realtime_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Add realtime signal result to job summary
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        run: |
          {
            echo "## Microcap realtime digest"
            echo
            echo "- Planned: ${PLANNED_BJ}"
            echo "- Started: ${STARTED_BJ}"
            echo "- Refresh state exit code: ${{ steps.refresh_state.outputs.exit_code }}"
            echo "- v2.0 script exit code: ${{ steps.signals_v20.outputs.exit_code }}"
            echo "- v2.3 script exit code: ${{ steps.signals_v23.outputs.exit_code }}"
            echo "- v2.5 script exit code: ${{ steps.signals_v25.outputs.exit_code }}"
            echo "- Artifact: microcap-realtime-digest"
            echo
            echo "### Refresh"
            echo '```text'
            cat microcap/realtime_state_refresh_result.txt
            echo '```'
            echo
            echo "### v2.0"
            echo '```text'
            cat microcap/realtime_signal_v2_0_result.txt
            echo '```'
            echo
            echo "### v2.3"
            echo '```text'
            cat microcap/realtime_signal_v2_3_result.txt
            echo '```'
            echo
            echo "### v2.5"
            echo '```text'
            cat microcap/realtime_signal_v2_5_result.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when realtime signal script failed
        if: steps.delivery_gate.outputs.should_send == 'true' && (steps.signals_v20.outputs.exit_code != '0' || steps.signals_v23.outputs.exit_code != '0' || steps.signals_v25.outputs.exit_code != '0')
        run: exit 1
