name: Microcap Post-Close Digest

on:
  workflow_dispatch:
    inputs:
      catch_up_date:
        description: "Explicit missing normal close report date; must equal independent latest completed session; original dedupe retained"
        required: false
        type: string
        default: ""
      recovery_check:
        description: "Recovery-only maintenance: save an approved archive, then require the next run to restore it; no market refresh or email"
        required: false
        type: choice
        options: ['off', bootstrap, require_hit]
        default: 'off'
      recovery_strategy_sha:
        description: "Exact candidate runtime for recovery-only pre-activation acceptance; normal delivery pin stays unchanged"
        required: false
        type: string
        default: ""
      validation_only:
        description: "Validate refresh, all signals and artifacts without sending email or writing delivery markers"
        required: false
        type: boolean
        default: false
      delivery_test_id:
        description: "Explicit close-confirmed mail acceptance test ID (8-64 lowercase letters/digits/hyphens); separate dedupe markers"
        required: false
        type: string
        default: ""
      approved_state_url:
        description: "Optional explicitly approved whole-state release asset; used only for this manual run"
        required: false
        type: string
        default: ""
      approved_state_sha256:
        description: "Exact approved whole-state ZIP SHA-256 (required with approved_state_url)"
        required: false
        type: string
        default: ""
      approved_state_date:
        description: "Approved seed session date YYYY-MM-DD (required with approved_state_url)"
        required: false
        type: string
        default: ""
      correction:
        description: "Bypass the daily delivery marker and label this email as a corrected edition"
        required: false
        type: boolean
        default: false
      external_schedule:
        description: "Apply the trading-day and same-day guards used by an external scheduler"
        required: false
        type: boolean
        default: false
      publication_mode:
        description: "Use close_confirmed for the normal post-close digest; realtime remains manual-only"
        required: true
        type: choice
        options:
          - realtime
          - close_confirmed
        default: close_confirmed

permissions:
  contents: read
  actions: write
  checks: write

concurrency:
  group: microcap-realtime-digest
  cancel-in-progress: false

jobs:
  regression:
    needs: check-trading-day
    if: needs.check-trading-day.result == 'success' && (needs.check-trading-day.outputs.SHOULD_RUN_MICROCAP == 'true' || (github.event_name == 'workflow_dispatch' && inputs.external_schedule != true && (inputs.validation_only == true || inputs.correction == true || inputs.delivery_test_id != '' || inputs.recovery_check == 'bootstrap' || inputs.recovery_check == 'require_hit')))
    uses: ./.github/workflows/delivery-regression.yml
    with:
      family: microcap
      recovery_strategy_sha: ${{ inputs.recovery_strategy_sha || '' }}

  check-trading-day:
    runs-on: ubuntu-latest
    outputs:
      SHOULD_RUN_MICROCAP: ${{ steps.calendar.outputs.SHOULD_RUN_MICROCAP }}
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Reject candidate runtime outside recovery-only maintenance
        env:
          CANDIDATE_SHA: ${{ inputs.recovery_strategy_sha }}
          RECOVERY_MODE: ${{ inputs.recovery_check }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
          CORRECTION: ${{ inputs.correction }}
          EXTERNAL_SCHEDULE: ${{ inputs.external_schedule }}
          DELIVERY_TEST_ID: ${{ inputs.delivery_test_id }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: |
          python - <<'PY'
          import os, re
          e = os.environ
          if e['CANDIDATE_SHA'] and (not re.fullmatch('[0-9a-f]{40}', e['CANDIDATE_SHA']) or e['RECOVERY_MODE'] not in {'bootstrap', 'require_hit'} or any(e[k] == 'true' for k in ('VALIDATION_ONLY', 'CORRECTION', 'EXTERNAL_SCHEDULE')) or e['DELIVERY_TEST_ID'] or e['PUBLICATION_MODE'] != 'close_confirmed'):
              raise SystemExit('Candidate runtime is allowed only for explicit no-send recovery maintenance')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check A-share trading day
        id: calendar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3" "akshare==1.18.46"
          python - <<'PY' | tee calendar.env
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import akshare as ak
          import pandas as pd

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          should_run = False
          try:
              trade_dates = ak.tool_trade_date_hist_sina()
              dates = set(pd.to_datetime(trade_dates["trade_date"]).dt.date)
              if not dates or not min(dates) <= today <= max(dates):
                  raise ValueError("Trading calendar does not cover today's date")
              should_run = today in dates
          except Exception as exc:
              print(f"A_SHARE_CALENDAR_ERROR={type(exc).__name__}: {exc}")
              raise RuntimeError("Trading calendar unavailable; not a confirmed holiday") from exc
          print(f"A_SHARE_TODAY={today.isoformat()}")
          if should_run:
              print("SHOULD_RUN_MICROCAP=true")
          else:
              print("SHOULD_RUN_MICROCAP=false")
          PY
          cat calendar.env >> "$GITHUB_OUTPUT"

  send:
    needs: [check-trading-day, regression]
    if: always() && (inputs.recovery_check == '' || inputs.recovery_check == 'off') && needs.regression.result == 'success' && needs.check-trading-day.result == 'success' && (needs.check-trading-day.outputs.SHOULD_RUN_MICROCAP == 'true' || (github.event_name == 'workflow_dispatch' && inputs.external_schedule != true && (inputs.validation_only == true || inputs.correction == true || inputs.delivery_test_id != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      PLANNED_BJ: "16:00 Asia/Shanghai"
      MICROCAP_DAILY_STOCK_PROVIDER: tencent
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record workflow start time
        run: echo "STARTED_BJ=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Check out automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve publication mode
        id: publication_mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_mode || 'close_confirmed' }}
        run: python automation/scripts/resolve_cn_publication_mode.py --requested "${REQUESTED_MODE}"

      - name: Verify accepted production recovery identity
        run: python -B automation/scripts/verify_microcap_active_recovery.py --root automation

      - name: Check delivery marker
        id: delivery_gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only && 'true' || 'false' }}
          CORRECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.correction && 'true' || 'false' }}
          DELIVERY_TEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_test_id || '' }}
          CATCH_UP_DATE: ${{ inputs.catch_up_date }}
          EXTERNAL_SCHEDULE: ${{ inputs.external_schedule == true && 'true' || 'false' }}
        run: |
          args=()
          if [[ -n "${CATCH_UP_DATE}" ]]; then args+=(--catch-up-date "${CATCH_UP_DATE}"); fi
          if [[ "${VALIDATION_ONLY}" == "true" ]]; then
            args+=(--validation-only)
          fi
          if [[ "${CORRECTION}" == "true" ]]; then
            args+=(--correction)
          fi
          if [[ -n "${DELIVERY_TEST_ID}" ]]; then
            if [[ "${EXTERNAL_SCHEDULE}" == "true" ]]; then
              echo "Delivery tests cannot be scheduled production runs"
              exit 1
            fi
            args+=(--delivery-test-id "${DELIVERY_TEST_ID}")
          fi
          python automation/scripts/check_microcap_delivery.py --publication-mode "${{ steps.publication_mode.outputs.mode }}" "${args[@]}"

      - name: Recover delivery marker from accepted SMTP receipt
        if: inputs.validation_only != true && steps.delivery_gate.outputs.recover_marker == 'true'
        shell: bash
        run: |
          mkdir -p delivery-marker
          printf '%s\n' "${GITHUB_RUN_URL}" > delivery-marker/run-url.txt

      - name: Mark recovered digest delivered
        if: inputs.validation_only != true && steps.delivery_gate.outputs.recover_marker == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}
          path: delivery-marker/run-url.txt
          if-no-files-found: error
          retention-days: 30

      - name: Check out microcap repository
        if: steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: da981743e0471526ccbeb498813e681864c6bed8
          path: microcap

      - name: Record microcap strategy SHA
        id: microcap_sha
        if: steps.delivery_gate.outputs.should_send == 'true'
        working-directory: microcap
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install runtime dependencies
        if: steps.delivery_gate.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "pandas<3" requests "akshare==1.18.46" "baostock==0.9.1" matplotlib

      - name: Resolve independent completed session
        id: market_target
        if: steps.delivery_gate.outputs.should_send == 'true'
        working-directory: microcap
        shell: bash
        env:
          CATCH_UP_DATE: ${{ inputs.catch_up_date }}
        run: |
          python -c 'import os,sys; from scripts.exchange_calendar import latest_completed_session; sys.path.insert(0,"../automation/scripts"); from check_microcap_refresh_target import validate_catch_up_completed; completed=latest_completed_session().isoformat(); validate_catch_up_completed(os.environ.get("CATCH_UP_DATE",""),completed); print("date=" + completed)' >> "${GITHUB_OUTPUT}"

      - name: Restore persistent full rebalance cache
        continue-on-error: true
        id: full_cache_restore
        if: steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/cache/restore@v4
        with:
          path: microcap/.microcap_index_cache
          key: microcap-full-rebalance-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            microcap-full-rebalance-v1-${{ runner.os }}-

      - name: Bootstrap full rebalance cache on cold start
        continue-on-error: true
        timeout-minutes: 3
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.full_cache_restore.outputs.cache-matched-key == ''
        shell: bash
        env:
          CACHE_URL: https://github.com/liuruojiang/microcap/releases/download/microcap-full-rebalance-cache-v1-20260903/microcap-full-rebalance-cache-v1-20260903.zip
          CACHE_SHA256: ecee736f9bb35ac4b43a63e4fd7c83b0a4e9d8c94903f2631b5763a4e1d46686
        run: |
          cache_bundle="${RUNNER_TEMP}/microcap-full-rebalance-cache-v1.zip"
          curl --fail --location --connect-timeout 10 --max-time 90 --retry 1 --retry-max-time 120 --retry-all-errors --output "${cache_bundle}" "${CACHE_URL}"
          echo "${CACHE_SHA256}  ${cache_bundle}" | sha256sum --check --strict
          python microcap/scripts/full_rebalance_cache_bundle.py restore \
            --root microcap \
            --bundle "${cache_bundle}" \
            --min-symbols 4500

      - name: Validate full rebalance cache
        id: full_cache
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          set +e
          python microcap/scripts/full_rebalance_cache_bundle.py validate \
            --root microcap \
            --min-symbols 4500 2>&1 | tee microcap/full_rebalance_cache_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          exit 0

      - name: Restore explicitly approved whole state
        id: approved_state
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && inputs.approved_state_url != ''
        shell: bash
        env:
          APPROVED_STATE_URL: ${{ inputs.approved_state_url }}
          APPROVED_STATE_SHA256: ${{ inputs.approved_state_sha256 }}
          APPROVED_STATE_DATE: ${{ inputs.approved_state_date }}
        run: |
          python automation/scripts/restore_approved_microcap_state.py \
            --root microcap \
            --bundle "${RUNNER_TEMP}/microcap-approved-whole-state.zip" \
            --url "${APPROVED_STATE_URL}" \
            --sha256 "${APPROVED_STATE_SHA256}" \
            --seed-date "${APPROVED_STATE_DATE}"

      # A verified bundle contains the refreshed proxy state as well as its
      # audited raw-cache anchors.  Keep it separately from the raw cache so
      # a cancellation after refresh can resume the same trade-day delivery.
      - name: Restore close-confirmed whole delivery
        id: whole_state_restore
        if: steps.publication_mode.outputs.mode == 'close_confirmed' && steps.delivery_gate.outputs.should_send == 'true' && inputs.approved_state_url == ''
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B -u automation/scripts/microcap_whole_state_recovery.py restore \
            --root microcap --bundle "${RUNNER_TEMP}/microcap-whole-delivery-state.zip" \
            --strategy-sha "${{ steps.microcap_sha.outputs.sha }}" \
            --not-after-date "${{ steps.market_target.outputs.date }}" \
            --receipt microcap/whole_state_recovery.json

      - name: Restore verified production state bundle
        continue-on-error: true
        id: verified_state_cache
        if: always() && steps.whole_state_restore.outputs.restored != 'true' && steps.delivery_gate.outputs.should_send == 'true' && inputs.approved_state_url == ''
        uses: actions/cache/restore@v4
        with:
          path: microcap/.realtime_state_bundle
          key: microcap-verified-state-v2-${{ steps.microcap_sha.outputs.sha }}-${{ runner.os }}-${{ steps.market_target.outputs.date }}
          # Reuse the most recent formally validated state across adjacent
          # trading days. restore_state revalidates anchors, while refresh
          # still establishes today's independent close before publication.
          restore-keys: |
            microcap-verified-state-v2-${{ steps.microcap_sha.outputs.sha }}-${{ runner.os }}-

      - name: Validate and restore cached production state
        id: cached_state_restore
        if: always() && steps.whole_state_restore.outputs.restored != 'true' && steps.delivery_gate.outputs.should_send == 'true' && steps.verified_state_cache.outputs.cache-matched-key != '' && inputs.approved_state_url == ''
        shell: bash
        run: |
          set +e
          # Recovery accepts a verified older anchor across weekends/holidays;
          # refresh must still reach the independent completed session today.
          python microcap/scripts/realtime_state_bundle.py restore \
            --root microcap \
            --bundle microcap/.realtime_state_bundle/microcap-top100-state.zip \
            2>&1 | tee microcap/cached_state_restore_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          exit 0

      # GitHub's cache is deliberately evictable.  A successful formal state
      # pack is also retained as an artifact so a cache miss after a holiday
      # resumes incrementally instead of triggering a historical rebuild.
      - name: Restore durable verified production state bundle
        continue-on-error: true
        id: durable_state_artifact
        if: always() && steps.whole_state_restore.outputs.restored != 'true' && steps.delivery_gate.outputs.should_send == 'true' && steps.cached_state_restore.outputs.validated != 'true' && inputs.approved_state_url == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python automation/scripts/restore_microcap_verified_state.py \
            --bundle microcap/.realtime_state_bundle/microcap-top100-state.zip \
            --artifact-name "microcap-verified-state-recovery-v2-${{ steps.microcap_sha.outputs.sha }}" \
            --require-success

      - name: Restore verified production state
        id: verified_state_restore
        if: always() && steps.whole_state_restore.outputs.restored != 'true' && steps.delivery_gate.outputs.should_send == 'true' && steps.durable_state_artifact.outputs.restored == 'true' && inputs.approved_state_url == ''
        shell: bash
        run: |
          set +e
          python microcap/scripts/realtime_state_bundle.py restore \
            --root microcap \
            --bundle microcap/.realtime_state_bundle/microcap-top100-state.zip \
            2>&1 | tee microcap/realtime_state_restore_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          exit 0

      - name: Restore approved release fallback
        id: approved_release_fallback
        if: always() && steps.whole_state_restore.outputs.restored != 'true' && steps.delivery_gate.outputs.should_send == 'true' && inputs.approved_state_url == '' && steps.cached_state_restore.outputs.validated != 'true' && steps.verified_state_restore.outputs.validated != 'true'
        shell: bash
        run: |
          python automation/scripts/restore_approved_microcap_state.py \
            --root microcap \
            --bundle "${RUNNER_TEMP}/microcap-approved-release-state.zip" \
            --config automation/config/microcap_approved_state.json

      # A complete approved release can repair a failed legacy raw-cache bootstrap.
      # Revalidate the restored files before permitting refresh or publication.
      - name: Validate recovered full rebalance cache
        id: recovered_full_cache
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && (steps.whole_state_restore.outputs.restored == 'true' || steps.approved_state.outputs.restored == 'true' || (inputs.approved_state_url == '' && (steps.cached_state_restore.outputs.validated == 'true' || steps.verified_state_restore.outputs.validated == 'true' || steps.approved_release_fallback.outputs.restored == 'true')))
        shell: bash
        run: |
          set +e
          python microcap/scripts/full_rebalance_cache_bundle.py validate \
            --root microcap \
            --min-symbols 4500 2>&1 | tee microcap/recovered_full_rebalance_cache_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          exit 0

      - name: Resolve same-day static refresh mode
        id: refresh_mode
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.recovered_full_cache.outputs.validated == 'true' && (steps.whole_state_restore.outputs.restored == 'true' || steps.approved_state.outputs.restored == 'true' || (inputs.approved_state_url == '' && (steps.cached_state_restore.outputs.validated == 'true' || steps.verified_state_restore.outputs.validated == 'true' || steps.approved_release_fallback.outputs.restored == 'true')))
        shell: bash
        env:
          EXPECTED_DATE: ${{ steps.market_target.outputs.date }}
        run: |
          python -c 'import json, os, sys; from pathlib import Path; sys.path.insert(0,"automation/scripts"); from check_microcap_refresh_target import can_reuse_static_inputs, cn_today; expected=os.environ["EXPECTED_DATE"]; path=Path("microcap/.microcap_index_cache/realtime/top100_realtime_refresh_proof.json"); proof=json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}; reusable=can_reuse_static_inputs(proof,expected,cn_today()); print(f"force_static_inputs={str(not reusable).lower()}"); print(f"same_day_validated_state={str(reusable).lower()}")' >> "${GITHUB_OUTPUT}"

      - name: Clear stale signal outputs
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          for root in microcap; do
            [[ -d "${root}" ]] || continue
            mkdir -p "${root}/outputs"
            rm -f "${root}"/realtime_state_refresh_result.txt "${root}"/realtime_signal_result.txt "${root}"/realtime_signal_v2_0_result.txt "${root}"/realtime_signal_v2_3_result.txt "${root}"/realtime_signal_v2_5_result.txt "${root}"/outputs/*_realtime_signal.csv "${root}"/outputs/*_latest_signal.csv
          done

      - name: Snapshot this refresh notice boundary
        id: notice_snapshot
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.recovered_full_cache.outputs.validated == 'true' && (steps.whole_state_restore.outputs.restored == 'true' || steps.approved_state.outputs.restored == 'true' || (inputs.approved_state_url == '' && (steps.cached_state_restore.outputs.validated == 'true' || steps.verified_state_restore.outputs.validated == 'true' || steps.approved_release_fallback.outputs.restored == 'true')))
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python -B automation/scripts/collect_microcap_notice_failure.py snapshot \
            --root microcap --out "${RUNNER_TEMP}/microcap-notice-run-evidence" \
            --baseline "${RUNNER_TEMP}/microcap-notice-run-evidence/baseline.json" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Refresh Top100 realtime state
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.recovered_full_cache.outputs.validated == 'true' && (steps.whole_state_restore.outputs.restored == 'true' || steps.approved_state.outputs.restored == 'true' || (inputs.approved_state_url == '' && (steps.cached_state_restore.outputs.validated == 'true' || steps.verified_state_restore.outputs.validated == 'true' || steps.approved_release_fallback.outputs.restored == 'true')))
        id: refresh_state
        working-directory: microcap
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          status=1
          : > realtime_state_refresh_result.txt
          # A prior full-cache refresh has already established the frozen state.
          # Four workers only parallelize independent public-price tail requests;
          # the workflow-level concurrency group still serializes publications.
          # Individual providers already have bounded retries. Allow one whole-
          # refresh retry only for identified transient transport failures;
          # permanent or unknown failures stop without discarding useful caches.
          progress_check_id=""
          publish_progress_check() {
            local summary="$1"
            PROGRESS_SUMMARY="${summary}" python -c 'import json, os; print(json.dumps({"name": "Microcap refresh progress", "head_sha": os.environ["GITHUB_SHA"], "status": "in_progress", "output": {"title": "Microcap Top100 refresh", "summary": os.environ["PROGRESS_SUMMARY"]}}))' > progress_check_payload.json
            if [[ -z "${progress_check_id}" ]]; then
              progress_check_id=$(curl --silent --show-error --fail-with-body \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data @progress_check_payload.json \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
                | python -c "import json, sys; print(json.load(sys.stdin)['id'])") || true
            elif [[ -n "${progress_check_id}" ]]; then
              curl --silent --show-error --fail-with-body \
                --request PATCH \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data @progress_check_payload.json \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${progress_check_id}" >/dev/null || true
            fi
          }
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "refresh_attempt=${attempt}" | tee -a realtime_state_refresh_result.txt
            attempt_log="realtime_state_refresh_attempt_${attempt}.log"
            : > "${attempt_log}"
            started_epoch=$(date +%s)
            static_refresh_args=()
            if [[ "${{ steps.refresh_mode.outputs.force_static_inputs }}" == "true" ]]; then
              static_refresh_args+=(--force-refresh-static-inputs)
            fi
            # Create the check in this shell so its ID remains available to the
            # completion update below; IDs assigned in the heartbeat subshell
            # do not propagate back to this process.
            publish_progress_check "attempt=${attempt}; elapsed_seconds=0; initializing refresh"
            python -u scripts/realtime_state_bundle.py refresh \
              --root . \
              --max-workers 4 \
              "${static_refresh_args[@]}" > "${attempt_log}" 2>&1 &
            refresh_pid=$!
            (
              while kill -0 "${refresh_pid}" 2>/dev/null; do
                elapsed_seconds=$(( $(date +%s) - started_epoch ))
                echo "::notice title=Microcap refresh heartbeat::attempt=${attempt}; elapsed_seconds=${elapsed_seconds}; pid=${refresh_pid}"
                tail -n 8 "${attempt_log}" || true
                progress_line=$(grep -E 'price-cache refresh progress [0-9]+/[0-9]+ \([0-9.]+%\)|\[realtime-state\] phase=' "${attempt_log}" | tail -n 1 || true)
                publish_progress_check "attempt=${attempt}; elapsed_seconds=${elapsed_seconds}; ${progress_line:-initializing refresh}"
                sleep 60
              done
            ) &
            heartbeat_pid=$!
            wait "${refresh_pid}"
            status=$?
            kill "${heartbeat_pid}" 2>/dev/null || true
            wait "${heartbeat_pid}" 2>/dev/null || true
            cat "${attempt_log}" | tee -a realtime_state_refresh_result.txt
            if [[ "${status}" -eq 0 ]]; then
              break
            fi
            # A rejected history/lineage cannot be repaired by re-fetching the
            # same inputs. Preserve the failed status and require exact-hash
            # review; transient transport failures keep the existing retry path.
            if grep -Eiq 'StNoticeEvidenceError|SecurityMetaHistoryEvidenceUnresolved|Daily installed input seed is incomplete|ST metadata archive|ST archive requires a portable pointer|SecurityMetaHistoryCorrectionRequired|Security metadata (historical intervals|identity) changed|exact-hash lineage review is required|Exact frozen proxy seed|proxy metadata fingerprint mismatch|historical rewrite (detected|audit missing key columns)|Factor (source|body)|[Cc]ached return basis|[Tt]rade status|[Nn]otice archive|return-basis pipeline requires|qfq/hfq return basis disagreement|Fixed anchor|Legacy.*return basis|source group stopped|Daily (raw input|trade status|provider|inputs|prepared|close|refresh|target|BaoStock)|Previous complete raw snapshot|Raw history deletion|Historical (raw-price|adjusted-price)|Adjusted history deletion|Previous adjusted candidate|Legacy cache must be migrated|Unmanifested legacy|Incomplete factor coverage|Share-count history changed|Share source/cache identity|Share source response hash|Share source receipt identity|Incomplete share-source publication|Existing share history requires|Share baseline|Share source query chain|Share candidate does not reproduce source chain|Invalid historical proxy values|Incomplete finite member returns|Member authorities changed' "${attempt_log}"; then
              echo "::error title=Microcap refresh blocked::Non-retryable lineage or frozen-history rejection; review exact hashes before another run." | tee -a realtime_state_refresh_result.txt
              break
            fi
            if [[ "${attempt}" -ge 2 ]]; then
              echo "::error title=Microcap refresh stopped::Two whole-refresh attempts exhausted; preserve caches and diagnose before retry." | tee -a realtime_state_refresh_result.txt
              break
            fi
            # A recovered earlier provider failure cannot authorize retrying a
            # different terminal data/identity failure later in the same log.
            terminal_diagnostic=$(awk 'NF { line=$0 } END { print line }' "${attempt_log}")
            if ! grep -Eiq 'ReadTimeout|ConnectTimeout|ConnectionError|connection (reset|aborted)|timed out|HTTP(Error| error)?[: ]+(429|500|502|503|504)|temporary failure in name resolution' <<< "${terminal_diagnostic}"; then
              echo "::error title=Microcap refresh stopped::Unknown failure is not automatically retryable." | tee -a realtime_state_refresh_result.txt
              break
            fi
            sleep $(( attempt < 6 ? attempt * 20 : 120 ))
          done
          # Close the progress check with the actual refresh outcome.
          if [[ -n "${progress_check_id}" ]]; then
            completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            elapsed_seconds=$(( $(date +%s) - started_epoch ))
            progress_conclusion=failure
            progress_title="Microcap Top100 refresh blocked"
            if [[ "${status}" -eq 0 ]]; then
              progress_conclusion=success
              progress_title="Microcap Top100 refresh complete"
            fi
            PROGRESS_COMPLETED_AT="${completed_at}" \
            PROGRESS_CONCLUSION="${progress_conclusion}" \
            PROGRESS_TITLE="${progress_title}" \
            PROGRESS_SUMMARY="result=${progress_conclusion}; attempt=${attempt}; elapsed_seconds=${elapsed_seconds}; refresh_exit_code=${status}" \
              python -c 'import json, os; print(json.dumps({"name": "Microcap refresh progress", "head_sha": os.environ["GITHUB_SHA"], "status": "completed", "conclusion": os.environ["PROGRESS_CONCLUSION"], "completed_at": os.environ["PROGRESS_COMPLETED_AT"], "output": {"title": os.environ["PROGRESS_TITLE"], "summary": os.environ["PROGRESS_SUMMARY"]}}))' > progress_check_payload.json
            curl --silent --show-error --fail-with-body \
              --request PATCH \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data @progress_check_payload.json \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${progress_check_id}" >/dev/null || true
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          echo "REFRESH_STATE_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Preserve this refresh notice evidence including failures
        id: notice_evidence
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.refresh_state.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python -B automation/scripts/collect_microcap_notice_failure.py collect \
            --root microcap --out "${RUNNER_TEMP}/microcap-notice-run-evidence" \
            --baseline "${RUNNER_TEMP}/microcap-notice-run-evidence/baseline.json" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload bounded notice diagnostics
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.refresh_state.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-notice-refresh-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/microcap-notice-run-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Record refresh failure for digest
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && (steps.recovered_full_cache.outcome != 'success' || steps.recovered_full_cache.outputs.validated != 'true' || steps.refresh_state.outcome != 'success' || steps.refresh_state.outputs.validated != 'true')
        shell: bash
        run: |
          cache_exit="${{ steps.recovered_full_cache.outputs.exit_code }}"
          refresh_exit="${{ steps.refresh_state.outputs.exit_code }}"
          for item in "microcap:v2_0" "microcap:v2_3" "microcap:v2_5"; do
            root="${item%%:*}"
            version="${item##*:}"
            [[ -d "${root}" ]] || root=microcap
            cat > "${root}/realtime_signal_${version}_result.txt" <<EOF
          preflight_failed
          full_cache_exit_code: ${cache_exit:-not_run}
          refresh_exit_code: ${refresh_exit:-not_run}
          reason: Top100 full-cache validation or state refresh failed, so the ${version} signal was not run.
          refresh_log: microcap/realtime_state_refresh_result.txt
          EOF
          done

      - name: Prepare shared publication state
        id: state_bundle
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.refresh_state.outcome == 'success' && steps.refresh_state.outputs.validated == 'true'
        shell: bash
        env:
          EXPECTED_DATE: ${{ steps.market_target.outputs.date }}
        run: |
          if [[ "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            echo "Use the refreshed shared base; build one whole-delivery bundle after all three final results."
            exit 0
          fi
          # Calendar days since the previous close are irrelevant across a
          # holiday. The refreshed daily anchors must instead equal the
          # independently resolved latest completed exchange session.
          python microcap/scripts/realtime_state_bundle.py validate \
            --root microcap > "${RUNNER_TEMP}/microcap-refreshed-state-validation.json"
          python automation/scripts/check_microcap_refresh_target.py \
            --report "${RUNNER_TEMP}/microcap-refreshed-state-validation.json" \
            --expected-date "${EXPECTED_DATE}"
          python microcap/scripts/realtime_state_bundle.py pack \
            --root microcap \
            --bundle "${RUNNER_TEMP}/microcap-top100-state.zip"

      - name: Stage validated state bundle for same-day recovery
        if: steps.publication_mode.outputs.mode == 'realtime' && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success'
        shell: bash
        run: |
          mkdir -p microcap/.realtime_state_bundle
          cp "${RUNNER_TEMP}/microcap-top100-state.zip" microcap/.realtime_state_bundle/microcap-top100-state.zip

      - name: Preserve validated state bundle for long-gap recovery
        if: steps.publication_mode.outputs.mode == 'realtime' && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.validation_only == true && 'microcap-verified-state-validation' || inputs.delivery_test_id != '' && 'microcap-verified-state-validation' || format('microcap-verified-state-recovery-v2-{0}', steps.microcap_sha.outputs.sha) }}
          path: microcap/.realtime_state_bundle/microcap-top100-state.zip
          if-no-files-found: error
          retention-days: 90

      # Save immediately after the formal pack, before isolated signals and
      # Gmail.  A later interruption therefore never discards a completed
      # refresh and the next run can continue instead of rebuilding globally.
      - name: Persist validated state bundle for same-day recovery
        if: inputs.validation_only != true && steps.publication_mode.outputs.mode == 'realtime' && inputs.delivery_test_id == '' && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: microcap/.realtime_state_bundle
          key: microcap-verified-state-v2-${{ steps.microcap_sha.outputs.sha }}-${{ runner.os }}-${{ steps.market_target.outputs.date }}

      - name: Save refreshed full rebalance cache
        if: inputs.validation_only != true && inputs.delivery_test_id == '' && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: microcap/.microcap_index_cache
          key: microcap-full-rebalance-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Capture shared inputs before three-version generation
        id: shared_inputs_before
        if: steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success' && steps.publication_mode.outputs.mode == 'close_confirmed'
        shell: bash
        run: |
          python automation/scripts/check_microcap_shared_inputs.py capture \
            --root microcap --snapshot "${RUNNER_TEMP}/microcap-shared-inputs-before.json" \
            --expected-date "${{ steps.market_target.outputs.date }}"

      - name: Run v2.0 selected signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.shared_inputs_before.outcome == 'success')
        id: signals_v20
        working-directory: microcap
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          query=$(python -c 'print("\u4fe1\u53f7" if "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" else "\u5b9e\u65f6\u4fe1\u53f7")')
          timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_0.py "${query}" 2>&1 | tee realtime_signal_v2_0_result.txt
          status=${PIPESTATUS[0]}
          if [[ "${status}" -eq 0 && "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            # Cold runners have no previous costed NAV. Re-run the same frozen inputs
            # to require a clean historical-rewrite audit before whole-delivery packing.
            timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_0.py "${query}" 2>&1 | tee -a realtime_signal_v2_0_result.txt
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          echo "SIGNAL_V2_0_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Run v2.3 selected signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.shared_inputs_before.outcome == 'success')
        id: signals_v23
        working-directory: microcap
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          query=$(python -c 'print("\u4fe1\u53f7" if "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" else "\u5b9e\u65f6\u4fe1\u53f7")')
          timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_3.py "${query}" 2>&1 | tee realtime_signal_v2_3_result.txt
          status=${PIPESTATUS[0]}
          if [[ "${status}" -eq 0 && "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            # Cold runners have no previous costed NAV. Re-run the same frozen inputs
            # to require a clean historical-rewrite audit before whole-delivery packing.
            timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_3.py "${query}" 2>&1 | tee -a realtime_signal_v2_3_result.txt
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          echo "SIGNAL_V2_3_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Run v2.5 selected signal
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && steps.state_bundle.outcome == 'success' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.shared_inputs_before.outcome == 'success')
        id: signals_v25
        working-directory: microcap
        shell: bash
        env:
          TOP100_REALTIME_REQUIRE_STATE: "1"
        run: |
          set +e
          query=$(python -c 'print("\u4fe1\u53f7" if "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" else "\u5b9e\u65f6\u4fe1\u53f7")')
          timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_5.py "${query}" 2>&1 | tee realtime_signal_v2_5_result.txt
          status=${PIPESTATUS[0]}
          if [[ "${status}" -eq 0 && "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            # Cold runners have no previous costed NAV. Re-run the same frozen inputs
            # to require a clean historical-rewrite audit before whole-delivery packing.
            timeout --foreground 25m python -u microcap_top100_mom16_biweekly_live_v2_5.py "${query}" 2>&1 | tee -a realtime_signal_v2_5_result.txt
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          echo "SIGNAL_V2_5_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          exit 0

      - name: Check shared inputs after three-version generation
        id: shared_inputs_after
        if: always() && steps.publication_mode.outputs.mode == 'close_confirmed' && steps.shared_inputs_before.outcome == 'success' && steps.signals_v20.outputs.validated == 'true' && steps.signals_v23.outputs.validated == 'true' && steps.signals_v25.outputs.validated == 'true'
        shell: bash
        run: |
          set +e
          python automation/scripts/check_microcap_shared_inputs.py check \
            --root microcap --snapshot "${RUNNER_TEMP}/microcap-shared-inputs-before.json" \
            --expected-date "${{ steps.market_target.outputs.date }}"
          status=$?
          if [[ "${status}" -ne 0 ]]; then
            for version in 0 3 5; do
              echo "SIGNAL_V2_${version}_EXIT_CODE=shared_inputs_changed" >> "${GITHUB_ENV}"
            done
          fi
          exit "${status}"

      - name: Verify and pack all three final deliveries
        id: whole_delivery
        if: always() && steps.publication_mode.outputs.mode == 'close_confirmed' && steps.shared_inputs_after.outcome == 'success' && steps.signals_v20.outputs.validated == 'true' && steps.signals_v23.outputs.validated == 'true' && steps.signals_v25.outputs.validated == 'true'
        shell: bash
        run: |
          set +e
          python microcap/scripts/top100_cloud_delivery.py pack \
            --root microcap --v23-root microcap --v25-root microcap \
            --expected-date "${{ steps.market_target.outputs.date }}" \
            --bundle "${RUNNER_TEMP}/microcap-whole-delivery-state.zip" 2>&1 | tee microcap/whole_delivery_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -eq 0 ]]; then echo "validated=true" >> "${GITHUB_OUTPUT}"; fi
          if [[ "${status}" != "0" ]]; then
            for version in 0 3 5; do
              echo "SIGNAL_V2_${version}_EXIT_CODE=whole_delivery_failed" >> "${GITHUB_ENV}"
            done
          fi
          exit 0

      # The next close run restores this same format/name before trying legacy
      # base-state caches. Save verified market state independently of SMTP.
      - name: Persist close-confirmed whole recovery state
        if: inputs.validation_only != true && inputs.delivery_test_id == '' && steps.whole_delivery.outputs.validated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-whole-delivery-recovery-v1-${{ steps.microcap_sha.outputs.sha }}
          path: ${{ runner.temp }}/microcap-whole-delivery-state.zip
          if-no-files-found: error
          retention-days: 90

      - name: Verify current share-source disclosures
        id: share_source_disclosures
        if: steps.whole_delivery.outputs.validated == 'true' && steps.publication_mode.outputs.mode == 'close_confirmed' && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          python -B -X utf8 microcap/scripts/sse_share_daily_unchanged_20261104.py \
            --root microcap --expected-date "${{ steps.market_target.outputs.date }}" \
            --out artifacts/share-source-disclosures.json

      - name: Build Markdown digest
        id: digest
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        env:
          CATCH_UP_DATE: ${{ inputs.catch_up_date }}
        run: |
          signal_suffix=realtime_signal
          v23_root=microcap
          v25_root=microcap
          share_disclosure_args=()
          if [[ "${{ steps.whole_delivery.outputs.validated }}" == "true" && "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            [[ "${{ steps.share_source_disclosures.outcome }}" == "success" ]] || exit 1
            share_disclosure_args+=(--share-source-disclosures artifacts/share-source-disclosures.json)
          fi
          if [[ "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            signal_suffix=latest_signal
            v23_root=microcap
            v25_root=microcap
          fi
          python automation/scripts/build_microcap_realtime_digest.py \
            --result v2.0=microcap/realtime_signal_v2_0_result.txt \
            --result v2.3=${v23_root}/realtime_signal_v2_3_result.txt \
            --result v2.5=${v25_root}/realtime_signal_v2_5_result.txt \
            --signal-csv v2.0=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_0_${signal_suffix}.csv \
            --signal-csv v2.3=${v23_root}/outputs/microcap_top100_mom16_biweekly_live_v2_3_${signal_suffix}.csv \
            --signal-csv v2.5=${v25_root}/outputs/microcap_top100_mom16_biweekly_live_v2_5_${signal_suffix}.csv \
            --out-dir artifacts \
            --publication-mode "${{ steps.publication_mode.outputs.mode }}" \
            --catch-up-date "${CATCH_UP_DATE}" \
            --expected-signal-date "${{ inputs.validation_only != true && inputs.correction != true && inputs.delivery_test_id == '' && steps.delivery_gate.outputs.delivery_date || '' }}" \
            --delivery-test-id "${{ steps.delivery_gate.outputs.delivery_test_id }}" \
            --planned "${PLANNED_BJ}" \
            --started "${STARTED_BJ}" \
            --strategy-sha "${{ steps.microcap_sha.outputs.sha }}" \
            --subject-prefix "${{ steps.delivery_gate.outputs.subject_prefix }}" \
            --exit-code "v2.0=${SIGNAL_V2_0_EXIT_CODE:-unknown}" \
            --exit-code "v2.3=${SIGNAL_V2_3_EXIT_CODE:-unknown}" \
            --exit-code "v2.5=${SIGNAL_V2_5_EXIT_CODE:-unknown}" \
            "${share_disclosure_args[@]}"
          digest_status=$(python -c 'import json; print(json.load(open("artifacts/metadata.json", encoding="utf-8"))["status"])')
          echo "status=${digest_status}" >> "${GITHUB_OUTPUT}"

      - name: Persist normal-send intent before SMTP
        id: send_intent
        if: inputs.validation_only != true && steps.delivery_gate.outputs.should_send == 'true' && steps.digest.outputs.status == 'OK' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.validated == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}-send-intent
          path: artifacts/metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Send Gmail
        id: send_gmail
        if: inputs.validation_only != true && always() && steps.delivery_gate.outputs.should_send == 'true' && steps.digest.outcome == 'success' && (inputs.delivery_test_id == '' || steps.digest.outputs.status == 'OK') && (steps.digest.outputs.status != 'OK' || (steps.send_intent.outcome == 'success' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.validated == 'true')))
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python automation/scripts/send_report.py artifacts/metadata.json --receipt artifacts/smtp-accepted.json

      # Persist SMTP acceptance before the delivery marker. If a runner stops
      # after acceptance, a later run can reconcile the marker without sending
      # a duplicate digest or rebuilding the production state.
      - name: Preserve accepted SMTP receipt
        id: smtp_receipt
        if: inputs.validation_only != true && steps.delivery_gate.outputs.should_send == 'true' && steps.send_gmail.outcome == 'success' && steps.digest.outputs.status == 'OK' && steps.signals_v20.outputs.validated == 'true' && steps.signals_v23.outputs.validated == 'true' && steps.signals_v25.outputs.validated == 'true' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.validated == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}-smtp-accepted
          path: |
            artifacts/metadata.json
            artifacts/smtp-accepted.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare delivery marker
        if: inputs.validation_only != true && steps.delivery_gate.outputs.should_send == 'true' && steps.send_gmail.outcome == 'success' && steps.smtp_receipt.outcome == 'success' && steps.digest.outputs.status == 'OK' && steps.signals_v20.outputs.validated == 'true' && steps.signals_v23.outputs.validated == 'true' && steps.signals_v25.outputs.validated == 'true' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.validated == 'true')
        shell: bash
        run: |
          mkdir -p delivery-marker
          printf '%s\n' "${GITHUB_RUN_URL}" > delivery-marker/run-url.txt

      - name: Preserve verified whole delivery for the next trading day
        if: steps.whole_delivery.outputs.validated == 'true' && steps.digest.outputs.status == 'OK' && (inputs.validation_only == true || steps.send_gmail.outcome == 'success')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ (inputs.validation_only == true || inputs.delivery_test_id != '') && 'microcap-whole-delivery-validation-state' || 'microcap-whole-delivery-state' }}
          path: ${{ runner.temp }}/microcap-whole-delivery-state.zip
          if-no-files-found: error
          retention-days: 90

      - name: Mark digest delivered
        if: inputs.validation_only != true && steps.delivery_gate.outputs.should_send == 'true' && steps.send_gmail.outcome == 'success' && steps.smtp_receipt.outcome == 'success' && steps.digest.outputs.status == 'OK' && steps.signals_v20.outputs.validated == 'true' && steps.signals_v23.outputs.validated == 'true' && steps.signals_v25.outputs.validated == 'true' && (steps.publication_mode.outputs.mode != 'close_confirmed' || steps.whole_delivery.outputs.validated == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery_gate.outputs.marker_name }}
          path: delivery-marker/run-url.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload signal outputs
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-realtime-digest
          path: |
            artifacts/
            microcap/full_rebalance_cache_result.txt
            microcap/recovered_full_rebalance_cache_result.txt
            microcap/realtime_state_refresh_result.txt
            microcap/whole_delivery_result.txt
            microcap/whole_state_recovery.json
            microcap/realtime_signal_v2_0_result.txt
            microcap/realtime_signal_v2_3_result.txt
            microcap/realtime_signal_v2_5_result.txt
            microcap/outputs/*_realtime_signal.csv
            microcap/outputs/*_latest_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Add signal result to job summary
        if: always() && steps.delivery_gate.outputs.should_send == 'true'
        shell: bash
        run: |
          v23_root=microcap
          v25_root=microcap
          if [[ "${{ steps.publication_mode.outputs.mode }}" == "close_confirmed" ]]; then
            v23_root=microcap
            v25_root=microcap
          fi
          {
            echo "## Microcap signal digest"
            echo
            echo "- Validation only (no email or delivery markers): ${{ inputs.validation_only == true }}"
            echo "- Publication mode: ${{ steps.publication_mode.outputs.mode }}"
            echo "- Publication mode basis: ${{ steps.publication_mode.outputs.basis }}"
            echo "- Resolved at: ${{ steps.publication_mode.outputs.beijing_time }}"
            echo "- Digest status: ${{ steps.digest.outputs.status }}"
            echo "- Planned: ${PLANNED_BJ}"
            echo "- Started: ${STARTED_BJ}"
            echo "- Refresh state exit code: ${{ steps.refresh_state.outputs.exit_code }}"
            echo "- v2.0 script exit code: ${{ steps.signals_v20.outputs.exit_code }}"
            echo "- v2.3 script exit code: ${{ steps.signals_v23.outputs.exit_code }}"
            echo "- v2.5 script exit code: ${{ steps.signals_v25.outputs.exit_code }}"
            echo "- Artifact: microcap-realtime-digest"
            echo
            echo "### Refresh"
            echo '```text'
            if [[ -f microcap/realtime_state_refresh_result.txt ]]; then
              cat microcap/realtime_state_refresh_result.txt
            else
              echo "Refresh did not run because an earlier preflight failed."
            fi
            echo '```'
            echo
            echo "### v2.0"
            echo '```text'
            cat microcap/realtime_signal_v2_0_result.txt
            echo '```'
            echo
            echo "### v2.3"
            echo '```text'
            cat "${v23_root}/realtime_signal_v2_3_result.txt"
            echo '```'
            echo
            echo "### v2.5"
            echo '```text'
            cat "${v25_root}/realtime_signal_v2_5_result.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when signal publication failed
        if: always() && steps.delivery_gate.outputs.should_send == 'true' && (steps.digest.outputs.status != 'OK' || steps.signals_v20.outputs.validated != 'true' || steps.signals_v23.outputs.validated != 'true' || steps.signals_v25.outputs.validated != 'true' || (steps.publication_mode.outputs.mode == 'close_confirmed' && steps.whole_delivery.outputs.validated != 'true'))
        run: exit 1

  recovery-check:
    # Explicit maintenance publishes only an already-approved verified archive.
    # It never runs the mail/delivery-marker job or claims current-market freshness.
    needs: [check-trading-day, regression]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.validation_only != true && (inputs.recovery_check == 'bootstrap' || inputs.recovery_check == 'require_hit') && needs.regression.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Resolve approved recovery strategy pin
        id: recovery_pin
        env:
          CANDIDATE_SHA: ${{ inputs.recovery_strategy_sha }}
        run: |
          python -B - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          source = Path('automation/config/microcap_approved_state.json').read_bytes()
          config = json.loads(source)
          candidate = os.environ.get('CANDIDATE_SHA', '')
          if candidate:
              if not re.fullmatch('[0-9a-f]{40}', candidate):
                  raise SystemExit('Invalid exact candidate SHA')
              candidate_path = Path('automation/config/microcap_recovery_candidate.json')
              if candidate_path.exists():
                  reviewed = json.loads(candidate_path.read_bytes())
                  if reviewed.get('strategy_sha') != candidate or any(reviewed.get(k) != config[k] for k in ('state_url', 'state_sha256', 'state_date')):
                      raise SystemExit('Candidate review does not bind the exact approved seed and runtime')
                  config = reviewed
              else:
                  config['strategy_sha'] = candidate
          Path('recovery-config.json').write_text(json.dumps(config, indent=2) + '\n')
          bootstrap = dict(config)
          bootstrap['strategy_sha'] = config.get('bootstrap_strategy_sha', config['strategy_sha'])
          if not re.fullmatch('[0-9a-f]{40}', bootstrap['strategy_sha']):
              raise SystemExit('Invalid exact bootstrap runtime')
          Path('recovery-bootstrap-config.json').write_text(json.dumps(bootstrap, indent=2) + '\n')
          Path('recovery-config-provenance.json').write_text(json.dumps({'original_config_sha256': hashlib.sha256(source).hexdigest(), 'candidate_strategy_sha': candidate, 'scope': 'recovery_only_same_approved_seed_no_production_activation'}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('sha=' + config['strategy_sha'] + '\n')
              handle.write('bootstrap_sha=' + bootstrap['strategy_sha'] + '\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: ${{ steps.recovery_pin.outputs.sha }}
          path: microcap
          fetch-depth: 0
      - name: Require the recovery candidate to be a published mainline commit
        working-directory: microcap
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Install recovery dependencies
        run: python -m pip install numpy 'pandas<3' requests 'akshare==1.18.46' 'baostock==0.9.1' matplotlib
      - name: Resolve recovery identity and independent date ceiling
        id: identity
        working-directory: microcap
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python -B -c 'from scripts.exchange_calendar import latest_completed_session; print("date=" + latest_completed_session().isoformat())' >> "$GITHUB_OUTPUT"
      - name: Restore close-confirmed whole delivery
        id: whole_state_restore
        run: |
          args=()
          if [[ "${{ inputs.recovery_check }}" == "require_hit" ]]; then args+=(--require-hit); fi
          python -B -u automation/scripts/microcap_whole_state_recovery.py restore \
            --root microcap --bundle "${RUNNER_TEMP}/microcap-whole-delivery-state.zip" \
            --strategy-sha "${{ steps.identity.outputs.sha }}" \
            --not-after-date "${{ steps.identity.outputs.date }}" \
            --receipt microcap/whole_state_recovery.json "${args[@]}"
      - name: Select the reviewed original runtime for approved bootstrap restore
        if: inputs.recovery_check == 'bootstrap' && steps.whole_state_restore.outputs.restored != 'true'
        working-directory: microcap
        env:
          BOOTSTRAP_SHA: ${{ steps.recovery_pin.outputs.bootstrap_sha }}
        run: |
          git merge-base --is-ancestor "$BOOTSTRAP_SHA" origin/main
          git checkout --detach "$BOOTSTRAP_SHA"
      - name: Restore approved bootstrap only when no recovery artifact exists
        id: approved_bootstrap
        if: inputs.recovery_check == 'bootstrap' && steps.whole_state_restore.outputs.restored != 'true'
        run: |
          python -B -u automation/scripts/restore_approved_microcap_state.py \
            --root microcap --bundle "${RUNNER_TEMP}/microcap-whole-delivery-state.zip" \
            --config recovery-bootstrap-config.json
      - name: Return to the exact candidate after original approved restore
        if: steps.approved_bootstrap.outputs.restored == 'true'
        working-directory: microcap
        env:
          CANDIDATE_SHA: ${{ steps.recovery_pin.outputs.sha }}
        run: git checkout --detach "$CANDIDATE_SHA"
      - name: Repack approved restored state for the exact runtime
        id: approved_repack
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_check == 'bootstrap' && inputs.validation_only != true && inputs.correction != true && inputs.external_schedule != true && inputs.delivery_test_id == '' && inputs.publication_mode == 'close_confirmed' && steps.whole_state_restore.outcome == 'success' && steps.whole_state_restore.outputs.restored == 'false' && steps.approved_bootstrap.outcome == 'success' && steps.approved_bootstrap.outputs.restored == 'true'
        run: |
          python -B -u automation/scripts/microcap_whole_state_recovery.py repack-approved \
            --root microcap --bundle "${RUNNER_TEMP}/microcap-whole-delivery-state.zip" \
            --strategy-sha "${{ steps.identity.outputs.sha }}" \
            --not-after-date "${{ steps.identity.outputs.date }}" \
            --config recovery-config.json \
            --receipt microcap/approved_repack_identity.json
      - name: Record the exact restored archive for next-run comparison
        run: |
          python -B -u automation/scripts/microcap_whole_state_recovery.py describe \
            --root microcap --bundle "${RUNNER_TEMP}/microcap-whole-delivery-state.zip" \
            --strategy-sha "${{ steps.identity.outputs.sha }}" \
            --not-after-date "${{ steps.identity.outputs.date }}" \
            --receipt microcap/recovery_archive_identity.json
      - name: Persist close-confirmed whole recovery state
        uses: actions/upload-artifact@v7
        with:
          name: microcap-whole-delivery-recovery-v1-${{ steps.identity.outputs.sha }}
          path: ${{ runner.temp }}/microcap-whole-delivery-state.zip
          if-no-files-found: error
          retention-days: 90
      - name: Preserve actual recovery and three-version CSV evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-recovery-check-evidence
          path: |
            recovery-config.json
            recovery-bootstrap-config.json
            recovery-config-provenance.json
            microcap/whole_state_recovery.json
            microcap/recovery_archive_identity.json
            microcap/approved_repack_identity.json
            ${{ runner.temp }}/approved-repack-*/native_pack.log
            microcap/outputs/*_latest_signal.csv
            microcap/outputs/top100_delivery_manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Report archive recovery scope
        run: |
          echo 'Verified archive recovery only; current-session refresh and email were not run.' >> "$GITHUB_STEP_SUMMARY"
          cat microcap/whole_state_recovery.json >> "$GITHUB_STEP_SUMMARY"
          cat microcap/recovery_archive_identity.json >> "$GITHUB_STEP_SUMMARY"
