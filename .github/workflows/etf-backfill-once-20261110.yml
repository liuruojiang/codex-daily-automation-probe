name: One-time ETF backfill for 2026-11-10

on:
  push:
    branches: [main]
    paths: ['.github/workflows/etf-backfill-once-20261110.yml']

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'liuruojiang/codex-daily-automation-probe' && github.event.head_commit.message == 'Dispatch ETF digest backfill for 2026-11-10'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the existing production workflow once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          if datetime.now(ZoneInfo("Asia/Hong_Kong")).date() != date(2026, 11, 10):
              raise SystemExit("Refusing to dispatch outside the authorized report date")
          request = urllib.request.Request(
              "https://api.github.com/repos/liuruojiang/codex-daily-automation-probe/actions/workflows/etf-allocation-digest.yml/dispatches",
              data=json.dumps({"ref": "main", "inputs": {"send_email": True}}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise RuntimeError("Unexpected workflow dispatch response")
          print("Production ETF workflow dispatch accepted for 2026-11-10")
          PY
