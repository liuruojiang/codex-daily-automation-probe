name: AI HOT Digest

on:
  schedule:
    # Cloudflare primary: 09:00 Beijing daily. Native fallback: 09:30 Beijing.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email (false validates the real build without delivery)"
        type: boolean
        default: true
      report_date:
        description: '日报日期（YYYY-MM-DD）；留空读取今日最新日报'
        required: false
        type: string

concurrency:
  group: ai-hot-digest
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build AI HOT digest
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--report-date "$REPORT_DATE"); fi
          python scripts/daily_reports.py ai-hot --out-dir artifacts "${args[@]}"
      - name: Check daily delivery evidence
        id: delivery_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == false && 'true' || 'false' }}
        run: |
          args=()
          if [ "$VALIDATION_ONLY" == "true" ]; then args+=(--validation-only); fi
          python scripts/check_daily_digest_delivery.py --family ai-hot --metadata artifacts/metadata.json "${args[@]}"
      - name: Preserve send intent before SMTP
        if: steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ai-hot-send-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/metadata.json
            artifacts/send_intent.json
          if-no-files-found: error
          retention-days: 30
      - name: Send Gmail
        if: steps.delivery_gate.outputs.should_send == 'true'
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python scripts/send_report.py artifacts/metadata.json --receipt artifacts/delivery_receipt.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-hot-digest
          path: artifacts/
          retention-days: 30
