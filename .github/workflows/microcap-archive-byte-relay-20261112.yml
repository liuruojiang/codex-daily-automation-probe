name: Exact Top100 morning source reception archive relay
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: microcap-morning-repair-archive-relay
  cancel-in-progress: false
jobs:
  relay:
    if: github.repository == 'liuruojiang/codex-daily-automation-probe' && github.ref == 'refs/heads/codex/top100-morning-repair-relay-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: liuruojiang/codex-daily-automation-probe
      TAG: microcap-scoped-whole-20261126-c169efff
      BASE_TAG: microcap-scoped-whole-20261126-e1e014b9
      RECIPE_SHA: 1ffdefcdfe231f8b71d9bbec73ef92b0cac81ef177357fb2555572061092c960
      ARCHIVE_SHA: e9ae47ee0c317f83c27aed7523ffb5060209f04f0c431e7de7f849f829b1b47f
      ARCHIVE_SIZE: '785561697'
      ARCHIVE: microcap-whole-delivery-state-20261126-c169efff.zip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Reconcile the exact draft release
        run: |
          gh release view "$TAG" --repo "$REPO" --json isDraft,tagName,assets > release-before.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          current=json.load(open('release-before.json'))
          assert current['tagName']==os.environ['TAG']
          archive=[i for i in current['assets'] if i['name']==os.environ['ARCHIVE']]
          if archive:
              assert len(archive)==1 and archive[0]['state']=='uploaded'
              assert archive[0]['digest']=='sha256:'+os.environ['ARCHIVE_SHA']
              assert archive[0]['size']==int(os.environ['ARCHIVE_SIZE'])
          else:
              assert current['isDraft'] is True
          Path('target-present').write_text(str(bool(archive)).lower())
          PY
      - name: Reconstruct byte-identical archive and publish it
        run: |
          if [[ "$(cat target-present)" == 'false' ]]; then
            gh release download "$BASE_TAG" --repo "$REPO" --pattern 'microcap-whole-delivery-state-20261126-e1e014b9.zip'
            gh release download "$TAG" --repo "$REPO" --pattern 'whole-morning-repair-literals.gz' --pattern 'whole-morning-repair-delta.json'
            python -B scripts/microcap_archive_byte_relay_20261112.py
            gh release upload "$TAG" "$ARCHIVE" --repo "$REPO"
          fi
      - name: Verify uploaded bytes and publish draft
        run: |
          gh release view "$TAG" --repo "$REPO" --json tagName,assets > release-uploaded.json
          python - <<'PY'
          import json,os
          current=json.load(open('release-uploaded.json'))
          assert current['tagName']==os.environ['TAG']
          archive=[i for i in current['assets'] if i['name']==os.environ['ARCHIVE']]
          assert len(archive)==1 and archive[0]['state']=='uploaded'
          assert archive[0]['digest']=='sha256:'+os.environ['ARCHIVE_SHA']
          assert archive[0]['size']==int(os.environ['ARCHIVE_SIZE'])
          PY
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh release view "$TAG" --repo "$REPO" --json isDraft,tagName,assets > release-published.json
          python -c 'import json; assert json.load(open("release-published.json"))["isDraft"] is False'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exact-archive-relay-evidence
          path: |
            relay-result.json
            release-before.json
            release-uploaded.json
            release-published.json
          if-no-files-found: error
          retention-days: 90
