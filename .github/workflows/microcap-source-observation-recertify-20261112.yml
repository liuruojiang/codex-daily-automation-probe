name: One-off Microcap source observation recertification
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: microcap-independent-maintenance
  cancel-in-progress: false
jobs:
  recertify:
    if: github.repository == 'liuruojiang/codex-daily-automation-probe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
      - uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: 872abe41d48f818363d879cdf98b297d230377b4
          path: native
          persist-credentials: false
      - name: Install exact native archive dependencies
        run: python -m pip install 'numpy==2.4.3' 'pandas==2.3.3' requests matplotlib 'akshare==1.18.46' 'baostock==0.9.1' 'pytest>=8,<9'
      - name: Restore the fixed original M3 archive under its original runtime
        run: |
          mkdir -p evidence
          python -B automation/scripts/microcap_scoped_whole_recovery.py \
            --root native --runtime-sha 872abe41d48f818363d879cdf98b297d230377b4 \
            --not-after-date 2026-11-10 --bundle "$RUNNER_TEMP/original-m3.zip" \
            --receipt evidence/original-restore.json \
            --fallback-url https://github.com/liuruojiang/codex-daily-automation-probe/releases/download/microcap-scoped-whole-20261110-872abe41/microcap-whole-delivery-state-close-20261110.zip \
            --fallback-sha256 3d9aa183b614b272597bf81cfbd3b6fefdde021347fd36586e8047a6dc025e42 > evidence/original-restore.stdout.json
          python - <<'PY'
          import json
          value=json.load(open('evidence/original-restore.json'))
          assert value['bundle_sha256']=='3d9aa183b614b272597bf81cfbd3b6fefdde021347fd36586e8047a6dc025e42'
          assert value['runtime_sha']=='872abe41d48f818363d879cdf98b297d230377b4'
          assert value['seed_date']=='2026-11-10' and value['restored'] is True
          PY
      - name: Activate the complete exact source review while preserving restored data
        run: |
          python -B automation/scripts/activate_microcap_scoped_runtime.py --root native \
            --config automation/config/microcap_source_observation_archive_review_20261112.json \
            --restore-receipt evidence/original-restore.json --bundle "$RUNNER_TEMP/original-m3.zip" \
            --receipt evidence/source-activation.json > evidence/source-activation.stdout.json
      - name: Verify the exact new reader contracts on Linux
        working-directory: native
        run: |
          python -B -m pytest tests/test_m7_source_reader_20261112.py \
            tests/test_scoped_archive_source_revalidation.py tests/test_scoped_source_consumer.py \
            tests/test_share_later_quote_20261112.py tests/test_historical_share_close_20261109.py \
            -q -p no:cacheprovider --junitxml ../evidence/m7-native-source-tests.xml
      - name: Earn the native complete archive certificate without refreshing history
        run: |
          python -B native/scripts/top100_delivery.py recertify-archive-source \
            --expected-date 2026-11-10 > evidence/native-recertification.json
          cp native/outputs/top100_delivery_manifest.json evidence/recertified-manifest.json
      - name: Pack the native-validated archive without claiming a current signal
        run: |
          python -B native/scripts/top100_cloud_delivery.py pack-archive --root native \
            --v23-root native --v25-root native --expected-date 2026-11-10 \
            --bundle "$RUNNER_TEMP/microcap-whole-delivery-state-archive-20261110-m7-observation.zip" > evidence/native-pack.json
      - name: Read back the earned P2 source package through the exact new native consumer
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          archive=Path(os.environ['RUNNER_TEMP'])/'microcap-whole-delivery-state-archive-20261110-m7-observation.zip'
          with archive.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          Path('evidence/pack-before-source-stage.json').write_text(json.dumps({'sha256':digest,'bytes':archive.stat().st_size}))
          PY
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/p2-source-20261111.zip" \
            https://github.com/liuruojiang/codex-daily-automation-probe/releases/download/microcap-local-sources-20261111-3fe2e15e/microcap-local-sources-close-20261111-3fe2e15e.zip
          python -B automation/scripts/microcap_scoped_inputs.py import --root native \
            --bundle "$RUNNER_TEMP/p2-source-20261111.zip" \
            --sha256 3b327f9443105b59615338ca9e8572c07730cd64f77959a07b2af58c5cd4b3c0 \
            --date 2026-11-11 > evidence/p2-native-stage.json
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          value=json.load(open('evidence/p2-native-stage.json'))
          assert value['status']=='native_scoped_sources_staged'
          assert value['issuer_count']==300 and value['production_pointers_changed'] is False
          assert value['native_late_adoption_required'] is True and value['final_strategy_delivery'] is False
          assert value['source_target']=='2026-11-11'
          expected='3b327f9443105b59615338ca9e8572c07730cd64f77959a07b2af58c5cd4b3c0'
          assert value['bundle_sha256']==expected
          receipt=Path(value['receipt'])
          Path('evidence/p2-original-stage-receipt.json').write_bytes(receipt.read_bytes())
          inner=json.loads(receipt.read_bytes())
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'p2-source-20261111.zip') as source:
              manifest=json.loads(source.read('manifest.json'))
          assert manifest['runtime_sha']=='3fe2e15ee9e3f2ee7e25bbc328479f1fd9910d36'
          assert manifest['producer_commit']=='681e2f90708cff366c83c571cbe557968f11d2f5'
          assert inner['status']=='native_sources_staged' and inner['target']=='2026-11-11'
          assert inner['source_bundle_sha256']==expected and inner['files']==manifest['files']
          archive=Path(os.environ['RUNNER_TEMP'])/'microcap-whole-delivery-state-archive-20261110-m7-observation.zip'
          before=json.load(open('evidence/pack-before-source-stage.json'))
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==before['sha256']
          assert archive.stat().st_size==before['bytes']
          with zipfile.ZipFile(archive) as packed:
              assert not any(name.startswith('.microcap_index_cache/local_input_imports/') for name in packed.namelist())
          PY
      - name: Reconcile and publish the verified seed without overwriting an asset
        run: |
          python -B automation/scripts/publish_microcap_source_reader_archive_20261112.py \
            --root native --bundle "$RUNNER_TEMP/microcap-whole-delivery-state-archive-20261110-m7-observation.zip" \
            --evidence evidence --review automation/config/microcap_source_observation_archive_review_20261112.json > evidence/publication.stdout.json
      - name: Preserve source-only migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-source-observation-recertification-20261112
          path: |
            evidence
            ${{ runner.temp }}/scoped-whole-recovery-*/*.json
            ${{ runner.temp }}/scoped-whole-recovery-*/*.log
          if-no-files-found: error
          retention-days: 90
      - name: Preserve a packed candidate if publication failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-source-observation-publication-recovery-20261112
          path: ${{ runner.temp }}/microcap-whole-delivery-state-archive-20261110-m7-observation.zip
          if-no-files-found: warn
          retention-days: 90
