name: Retired November 2 close recovery (already delivered)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: microcap-realtime-digest
  cancel-in-progress: false
jobs:
  recover:
    # Historical evidence only. November 2 is delivered; dispatch cannot resend.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          repository: liuruojiang/microcap
          ref: a70ee78e3d0c077f3cfaaa06fb2137e1ac992da3
          path: microcap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse duplicate or uncertain prior delivery
        shell: python
        run: |
          import json,subprocess
          prefix='microcap-v2-close_confirmed-digest-delivered-2026-11-02'
          names=[prefix,prefix+'-smtp-accepted','microcap-close-recovery-20261102-send-intent']
          for name in names:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/${{ github.repository }}/actions/artifacts?name={name}&per_page=100']))
              assert not any(not x['expired'] for x in data['artifacts']), 'Existing delivery or intent: inspect before retry'
      - name: Install runtime
        run: python -m pip install numpy 'pandas<3' requests 'akshare==1.18.46' matplotlib
      - name: Download exact approved bundle and generated CSV evidence
        run: |
          gh release download top100-tencent-daily-20261102 --repo liuruojiang/microcap --pattern microcap-tencent-whole-delivery-20261102.zip
          echo '9338d5536584b131d0ee0a78fcf7a604f85970c21c30a33b77c35be6902c0864  microcap-tencent-whole-delivery-20261102.zip' | sha256sum -c -
          gh run download 41468131220 --repo liuruojiang/codex-daily-automation-probe --name microcap-realtime-digest --dir prior
      - name: Restore one shared whole delivery
        run: python microcap/scripts/top100_cloud_delivery.py restore --root microcap --bundle microcap-tencent-whole-delivery-20261102.zip --expected-date 2026-11-02
      - name: Check latest session and all three final deliveries
        working-directory: microcap
        run: python scripts/top100_delivery.py check
      - name: Compare already-generated cloud results with approved finals
        shell: python
        run: |
          from pathlib import Path
          import pandas as pd
          for version in ('0','3','5'):
              name=f'microcap_top100_mom16_biweekly_live_v2_{version}_latest_signal.csv'
              previous=list(Path('prior').rglob(name))
              assert previous
              for path in previous:
                  pd.testing.assert_frame_equal(pd.read_csv(path),pd.read_csv(Path('microcap/outputs')/name),check_exact=True,check_dtype=False)
      - name: Render dated formal close digest
        run: |
          python automation/scripts/build_microcap_realtime_digest.py \
            --result v2.0=prior/microcap/realtime_signal_v2_0_result.txt \
            --result v2.3=prior/microcap-v23/realtime_signal_v2_3_result.txt \
            --result v2.5=prior/microcap-v25/realtime_signal_v2_5_result.txt \
            --signal-csv v2.0=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_0_latest_signal.csv \
            --signal-csv v2.3=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_3_latest_signal.csv \
            --signal-csv v2.5=microcap/outputs/microcap_top100_mom16_biweekly_live_v2_5_latest_signal.csv \
            --out-dir artifacts --publication-mode close_confirmed --expected-signal-date 2026-11-02 \
            --strategy-sha a70ee78e3d0c077f3cfaaa06fb2137e1ac992da3 --subject-prefix '[补发]' \
            --exit-code v2.0=0 --exit-code v2.3=0 --exit-code v2.5=0
          python -c "import json; r=json.load(open('artifacts/metadata.json')); assert r['status']=='OK' and r['signal_date']=='2026-11-02'"
      - name: Preserve send intent
        uses: actions/upload-artifact@v7
        with:
          name: microcap-close-recovery-20261102-send-intent
          path: artifacts/metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Send Gmail
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python automation/scripts/send_report.py artifacts/metadata.json --receipt artifacts/smtp-accepted.json
      - name: Preserve accepted receipt and dated results
        uses: actions/upload-artifact@v7
        with:
          name: microcap-v2-close_confirmed-digest-delivered-2026-11-02-smtp-accepted
          path: |
            artifacts/
            microcap/outputs/*latest_signal.csv
            microcap/outputs/top100_delivery_manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve dated delivery marker
        uses: actions/upload-artifact@v7
        with:
          name: microcap-v2-close_confirmed-digest-delivered-2026-11-02
          path: artifacts/smtp-accepted.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure diagnostics without sending an error email
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-close-recovery-diagnostics
          path: artifacts/
