name: Daily Scheduler Probe

on:
  schedule:
    # 07:05 Asia/Shanghai == 23:05 UTC on the previous day.
    - cron: "5 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Write scheduler probe issue comment
        uses: actions/github-script@v8
        with:
          script: |
            const planned = "07:05 Asia/Shanghai";
            const now = new Date();
            const beijing = new Intl.DateTimeFormat("sv-SE", {
              timeZone: "Asia/Shanghai",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: false,
            }).format(now);

            const title = "Codex daily automation scheduler probe";
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "scheduler-probe",
              per_page: 10,
            });
            let issue = issues.find((item) => item.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: ["scheduler-probe"],
                body: [
                  "This issue records GitHub Actions schedule timing for daily digest delivery tests.",
                  "",
                  "| Planned | Beijing actual | UTC actual | Event | Run |",
                  "|---|---|---|---|---|",
                ].join("\n"),
              });
              issue = created.data;
            }

            const row = `| ${planned} | ${beijing} | ${now.toISOString()} | ${context.eventName} | ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId} |`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                "Scheduler probe run:",
                "",
                "| Planned | Beijing actual | UTC actual | Event | Run |",
                "|---|---|---|---|---|",
                row,
              ].join("\n"),
            });

            await core.summary
              .addHeading("Daily scheduler probe")
              .addTable([
                [
                  { data: "Planned", header: true },
                  { data: "Beijing actual", header: true },
                  { data: "UTC actual", header: true },
                  { data: "Event", header: true },
                ],
                [planned, beijing, now.toISOString(), context.eventName],
              ])
              .write();

      - name: Send scheduler probe email
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import smtplib
          import ssl
          from datetime import datetime
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo

          required = [
              "MAIL_SERVER",
              "MAIL_PORT",
              "MAIL_USERNAME",
              "MAIL_PASSWORD",
              "MAIL_FROM",
              "MAIL_TO",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required mail secrets: " + ", ".join(missing))

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          now_text = now.strftime("%Y-%m-%d %H:%M:%S %Z")
          subject = f"GitHub Actions 调度探针测试 - {now.strftime('%Y-%m-%d %H:%M')}"
          body = "\n".join(
              [
                  "这是一封 GitHub Actions 云端调度探针测试邮件。",
                  "",
                  f"计划时间：07:05 Asia/Shanghai",
                  f"实际发送时间：{now_text}",
                  f"触发事件：{os.environ.get('GITHUB_EVENT_NAME', '')}",
                  f"Run URL：{os.environ.get('GITHUB_RUN_URL', '')}",
                  "",
                  "如果你收到这封邮件，说明 GitHub Actions -> Gmail SMTP 通路已经打通。",
              ]
          )

          message = EmailMessage()
          message["Subject"] = subject
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message.set_content(body)

          server = os.environ["MAIL_SERVER"]
          port = int(os.environ["MAIL_PORT"])
          use_ssl = os.environ.get("MAIL_USE_SSL", "").strip().lower() in {"1", "true", "yes"} or port == 465
          context = ssl.create_default_context()
          if use_ssl:
              with smtplib.SMTP_SSL(server, port, context=context, timeout=30) as smtp:
                  smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(server, port, timeout=30) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
                  smtp.send_message(message)
          PY
