name: US ETF & Asset Allocation Digest

on:
  schedule:
    # Cloudflare primary: 05:30 Beijing daily. Native fallback: 06:00 Beijing.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the validated email and persist sent history (false runs collection and validation only)"
        type: boolean
        default: true

concurrency:
  group: etf-allocation-digest
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ETF market-data dependency
        run: python -m pip install "yfinance==0.2.66"
      - name: Build US ETF and asset allocation digest
        run: python scripts/daily_reports.py etf --out-dir artifacts
      - name: Validate ETF delivery artifacts
        run: python scripts/validate_etf_delivery.py artifacts/metadata.json
      - name: Check daily delivery evidence
        id: delivery_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == false && 'true' || 'false' }}
        run: |
          args=()
          if [ "$VALIDATION_ONLY" == "true" ]; then args+=(--validation-only); fi
          python scripts/check_daily_digest_delivery.py --family etf --metadata artifacts/metadata.json "${args[@]}"
      - name: Preserve send intent before SMTP
        if: steps.delivery_gate.outputs.should_send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: etf-send-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/metadata.json
            artifacts/send_intent.json
          if-no-files-found: error
          retention-days: 30
      - name: Send Gmail
        if: steps.delivery_gate.outputs.should_send == 'true'
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python scripts/send_report.py artifacts/metadata.json --receipt artifacts/delivery_receipt.json
      - name: Persist digest history
        if: steps.delivery_gate.outputs.should_send == 'true'
        run: |
          if [ -n "$(git status --porcelain digest_history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add digest_history
            git commit -m "Update US ETF allocation digest history [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
              if git push; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: us-etf-allocation-digest
          path: artifacts/
          retention-days: 30
