name: US ETF & Asset Allocation Digest

on:
  schedule:
    # 06:00 Asia/Shanghai == 22:00 UTC on the previous day.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build US ETF and asset allocation digest
        run: python scripts/daily_reports.py etf --out-dir artifacts
      - name: Send Gmail
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python scripts/send_report.py artifacts/metadata.json
      - name: Persist digest history
        run: |
          if [ -n "$(git status --porcelain digest_history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add digest_history
            git commit -m "Update US ETF allocation digest history [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
              if git push; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: us-etf-allocation-digest
          path: artifacts/
          retention-days: 30
