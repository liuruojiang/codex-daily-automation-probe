name: Microcap Independent Maintenance
run-name: ${{ inputs.dispatch_key != '' && format('microcap-dispatch:{0}', inputs.dispatch_key) || 'Microcap Independent Maintenance' }}
on:
  workflow_dispatch:
    inputs:
      dispatch_key:
        description: 'Scheduled slot identity for read-only dispatch reconciliation'
        type: string
        default: ''
      task:
        type: choice
        options: [maintenance, rebalance, rebalance_recovery, scoped_acceptance, scoped_readback]
        default: maintenance
permissions:
  contents: read
  actions: write
concurrency:
  group: microcap-independent-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read exact strategy runtime
        id: runtime
        env:
          TASK: ${{ inputs.task }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re,sys,os
          sys.path.insert(0,'automation/scripts')
          from restore_microcap_scoped_inputs import load_config
          host=load_config('automation/config/microcap_local_maintenance.json')
          scoped=json.load(open('automation/config/microcap_scoped_rebalance.json'))
          task=os.environ['TASK']
          legacy=(task=='maintenance' and host['owner']=='cloud') or (task=='rebalance' and not scoped['enabled'])
          print('host_enabled='+str(legacy).lower())
          value=json.load(open('automation/config/microcap_member_runtime.json'))['strategy_sha']
          assert re.fullmatch('[0-9a-f]{40}',value)
          print('sha='+value)
          legacy=json.load(open('automation/config/microcap_approved_state.json'))['strategy_sha']
          assert re.fullmatch('[0-9a-f]{40}',legacy)
          print('legacy_sha='+legacy)
          maintenance=json.load(open('automation/config/microcap_maintenance_runtime.json'))
          assert maintenance['baseline_sha']==legacy and re.fullmatch('[0-9a-f]{40}',maintenance['runtime_sha'])
          print('maintenance_sha='+maintenance['runtime_sha'])
          PY
      - uses: actions/checkout@v6
        if: steps.runtime.outputs.host_enabled == 'true'
        with:
          repository: liuruojiang/microcap
          ref: ${{ steps.runtime.outputs.sha }}
          path: microcap
      - uses: actions/checkout@v6
        if: steps.runtime.outputs.host_enabled == 'true'
        with:
          repository: liuruojiang/microcap
          ref: ${{ steps.runtime.outputs.legacy_sha }}
          path: legacy
      - name: Install maintenance runtime
        if: steps.runtime.outputs.host_enabled == 'true'
        run: python -m pip install numpy 'pandas<3' requests matplotlib 'akshare==1.18.46' 'baostock==0.9.1'
      - name: Resolve original rebalance calendar
        if: steps.runtime.outputs.host_enabled == 'true'
        id: schedule
        env:
          TASK: ${{ inputs.task }}
        run: |
          day=$(date '+%Y-%m-%d')
          python -B microcap/scripts/member_period_handoff.py schedule --root legacy --date "$day" --out schedule.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          s=json.load(open('schedule.json'))
          print('run='+str(s['is_trading_day'] and (os.environ['TASK']=='maintenance' or s['is_rebalance'])).lower())
          print('date='+s['date'])
          print('next='+s['next_session'])
          PY
      # This heavy legacy recovery belongs only to maintenance. The daily
      # signal workflow never invokes it or waits for this job.
      - name: Restore maintenance baseline
        if: steps.schedule.outputs.run == 'true'
        working-directory: legacy
        run: |
          target=$(python -c 'from scripts.exchange_calendar import latest_completed_session;print(latest_completed_session().isoformat())')
          python -B ../automation/scripts/microcap_whole_state_recovery.py restore --root . --bundle "$RUNNER_TEMP/whole.zip" --strategy-sha '${{ steps.runtime.outputs.legacy_sha }}' --not-after-date "$target" --receipt maintenance-restore.json
      - name: Activate reviewed maintenance runtime
        if: steps.schedule.outputs.run == 'true'
        run: python -B automation/scripts/activate_microcap_maintenance_runtime.py --root legacy --config automation/config/microcap_maintenance_runtime.json --restore-receipt legacy/maintenance-restore.json --receipt legacy/maintenance-runtime.json
      - name: Refresh maintenance inputs
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'maintenance'
        working-directory: legacy
        run: python -B ../automation/scripts/refresh_microcap_notice_retry.py refresh --root . --force-refresh-static-inputs
      - name: Preserve maintenance inputs
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'maintenance' && success()
        uses: actions/cache/save@v4
        with:
          path: legacy/.microcap_index_cache
          key: microcap-member-maintenance-v1-${{ steps.runtime.outputs.maintenance_sha }}-${{ github.run_id }}
      - name: Restore prepared maintenance inputs for rebalance
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        uses: actions/cache/restore@v4
        with:
          path: legacy/.microcap_index_cache
          key: microcap-member-maintenance-v1-${{ steps.runtime.outputs.maintenance_sha }}-${{ github.run_id }}
          restore-keys: microcap-member-maintenance-v1-${{ steps.runtime.outputs.maintenance_sha }}-
      - name: Restore verified locally maintained sources for rebalance
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        run: python -B automation/scripts/restore_microcap_scoped_inputs.py --root legacy --config automation/config/microcap_local_maintenance.json --not-after-date '${{ steps.schedule.outputs.date }}' --out local-source-restore
      - name: Build original close rebalance and three final streams
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        working-directory: legacy
        run: python -B scripts/top100_delivery.py refresh-all
      - name: Check original complete rebalance delivery
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        working-directory: legacy
        run: python -B scripts/top100_delivery.py check
      - name: Export confirmed rebalance candidate
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        run: python -B microcap/scripts/member_period_handoff.py bootstrap --root legacy --out candidate
      - name: Restore previous daily checkpoint for handoff
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        run: python -B automation/scripts/restore_microcap_member_checkpoint.py --strategy-sha '${{ steps.runtime.outputs.sha }}' --seed-config automation/config/microcap_member_checkpoint.json --not-after-date '${{ steps.schedule.outputs.date }}' --out previous
      - name: Bind close event to next-session membership
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        run: python -B microcap/scripts/member_period_handoff.py handoff --current previous/checkpoint.json --candidate candidate/checkpoint.json --session '${{ steps.schedule.outputs.date }}' --next-session '${{ steps.schedule.outputs.next }}' --out handoff
      - name: Verify rebalance checkpoint
        id: checkpoint
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance'
        run: |
          python -B microcap/scripts/member_period_handoff.py verify --checkpoint handoff/checkpoint.json
          artifact_name=$(python -B automation/scripts/restore_microcap_member_checkpoint.py --strategy-sha '${{ steps.runtime.outputs.sha }}' --describe-checkpoint handoff/checkpoint.json)
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Publish verified member checkpoint
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'rebalance' && success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          path: handoff/*
          if-no-files-found: error
          retention-days: 90
      - name: Preserve maintenance status and source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-independent-maintenance-${{ inputs.task }}
          path: |
            schedule.json
            local-source-restore/receipt.json
            legacy/maintenance-restore.json
            legacy/maintenance-runtime.json
            legacy/.microcap_index_cache/st_notice_sources
            legacy/.microcap_index_cache/st_notice_archive_pointer.json
            candidate
            handoff
          if-no-files-found: warn
          retention-days: 90
  scoped:
    if: inputs.task != 'maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
      - name: Read exact scoped maintenance configuration
        id: config
        env:
          TASK: ${{ inputs.task == 'rebalance_recovery' && 'rebalance' || inputs.task }}
        run: python -B automation/scripts/microcap_scoped_settings.py --config automation/config/microcap_scoped_rebalance.json --task "$TASK" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.config.outputs.run == 'true'
        with:
          repository: liuruojiang/microcap
          ref: ${{ steps.config.outputs.runtime_sha }}
          path: scoped-consumer
      - name: Install exact native validation dependencies
        if: steps.config.outputs.run == 'true'
        run: python -m pip install 'numpy==2.4.3' 'pandas==2.3.3' requests matplotlib 'akshare==1.18.46' 'baostock==0.9.1' pytest
      - name: Check frozen precision bridge with original daily reader
        if: steps.config.outputs.run == 'true' && inputs.task == 'scoped_acceptance'
        working-directory: scoped-consumer
        run: |
          git fetch --no-tags origin 4774966da38f0b5af18617f73cc67c39c9e41a8e
          python -B -m pytest tests/test_member_hedge_precision_bridge.py -q -p no:cacheprovider
      - name: Resolve scoped close and original rebalance schedule
        if: steps.config.outputs.run == 'true'
        id: schedule
        env:
          TASK: ${{ inputs.task }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os,sys,json
          from pathlib import Path
          sys.path.insert(0,str(Path('scoped-consumer').resolve()))
          from scripts.exchange_calendar import latest_completed_session
          from scripts.member_period_handoff import schedule
          target=latest_completed_session().isoformat()
          value=schedule(Path('scoped-consumer').resolve(),target)
          # Small-state recovery planning decides whether expensive work is needed.
          run=True
          print('run='+str(run).lower());print('date='+target)
          Path('scoped-schedule.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Restore latest member checkpoint for recovery planning
        if: steps.schedule.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
        run: |
          daily=$(python -c "import json;print(json.load(open('automation/config/microcap_member_runtime.json'))['strategy_sha'])")
          python -B automation/scripts/restore_microcap_member_checkpoint.py --strategy-sha "$daily" --seed-config automation/config/microcap_member_checkpoint.json --not-after-date "$TARGET" --out scoped-latest > scoped-latest-restore.json
      - name: Plan original missed periods against the real completed session
        id: plan
        if: steps.schedule.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
          TASK: ${{ inputs.task }}
        run: python -B automation/scripts/microcap_recovery_plan.py --consumer scoped-consumer --consumer-sha "$RUNTIME_SHA" --checkpoint scoped-latest/checkpoint.json --date "$TARGET" --task "$TASK" --out scoped-recovery-plan.json --github-output "$GITHUB_OUTPUT"
      - name: Restore sealed partial scoped recovery evidence
        id: resume
        if: steps.schedule.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
          PRODUCER_SHA: ${{ steps.config.outputs.producer_sha }}
        run: |
          args=()
          if [[ "${{ steps.plan.outputs.run }}" != 'true' ]]; then args+=(--orphan-only); fi
          python -B automation/scripts/restore_microcap_rebalance_recovery.py recover --runtime-sha "$RUNTIME_SHA" --producer-sha "$PRODUCER_SHA" --not-after-date "$TARGET" --out scoped-resume --github-output "$GITHUB_OUTPUT" "${args[@]}"
      - name: Validate preserved earned whole archive without refreshing
        id: orphan
        if: steps.plan.outputs.run != 'true' && steps.resume.outputs.restored == 'true' && steps.resume.outputs.formal_archive != ''
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
          PRODUCER_SHA: ${{ steps.config.outputs.producer_sha }}
        run: python -B automation/scripts/restore_microcap_rebalance_recovery.py orphan --consumer scoped-consumer --manifest '${{ steps.resume.outputs.manifest }}' --runtime-sha "$RUNTIME_SHA" --producer-sha "$PRODUCER_SHA" --not-after-date "$TARGET" --out scoped-orphan-publication --github-output "$GITHUB_OUTPUT"
      - name: Restore verified scoped whole delivery
        if: steps.schedule.outputs.run == 'true' && ((inputs.task != 'rebalance' && inputs.task != 'rebalance_recovery') || steps.plan.outputs.run == 'true')
        env:
          TASK: ${{ inputs.task }}
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
          TARGET: ${{ steps.schedule.outputs.date }}
          SEED_URL: ${{ steps.config.outputs.seed_url }}
          SEED_SHA256: ${{ steps.config.outputs.seed_sha256 }}
        run: |
          args=(--root scoped-consumer --runtime-sha "$RUNTIME_SHA" --not-after-date "$TARGET" --bundle "$RUNNER_TEMP/restored-scoped-whole.zip" --receipt scoped-restore.json)
          if [[ "$TASK" == 'scoped_readback' ]]; then
            args+=(--require-artifact)
          else
            args+=(--fallback-url "$SEED_URL" --fallback-sha256 "$SEED_SHA256")
          fi
          python -B automation/scripts/microcap_scoped_whole_recovery.py "${args[@]}"
      - name: Verify complete restored three-version archive without sending
        if: steps.schedule.outputs.run == 'true' && inputs.task != 'rebalance' && inputs.task != 'rebalance_recovery'
        run: python -B automation/scripts/check_microcap_scoped_archive.py --root scoped-consumer --receipt scoped-restore.json --out scoped-archive-acceptance.json
      - uses: actions/checkout@v6
        if: steps.schedule.outputs.run == 'true' && steps.plan.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        with:
          repository: liuruojiang/microcap
          ref: ${{ steps.config.outputs.producer_sha }}
          path: scoped-source-state/runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /scripts/
            /data/
            /.gitattributes
            /AGENTS.md
      - name: Restore original verified weekly maintenance roster
        if: steps.schedule.outputs.run == 'true' && steps.plan.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          ROSTER_SHA256: ${{ steps.config.outputs.roster_sha256 }}
        run: |
          python -B automation/scripts/microcap_scoped_settings.py --config automation/config/microcap_scoped_rebalance.json --roster-bundle scoped-weekly-roster.zip
          python -B automation/scripts/microcap_scoped_roster.py restore --bundle scoped-weekly-roster.zip --sha256 "$ROSTER_SHA256" --date "$TARGET" --out scoped-weekly-roster
      - name: Capture original R boundaries before source collection
        if: steps.plan.outputs.run == 'true'
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
        run: |
          args=()
          if [[ "${{ steps.resume.outputs.restored }}" == 'true' ]]; then args+=(--resume-state '${{ steps.resume.outputs.manifest }}'); fi
          python -B automation/scripts/run_microcap_scoped_rebalance.py boundary --consumer scoped-consumer --consumer-sha "$RUNTIME_SHA" --producer scoped-source-state/runtime --state scoped-source-state --date "$TARGET" --out scoped-prepare --delivery-out scoped-delivery --recovery-plan scoped-recovery-plan.json "${args[@]}"
      - name: Seal original R boundary recovery evidence
        if: steps.plan.outputs.run == 'true'
        env:
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
          PRODUCER_SHA: ${{ steps.config.outputs.producer_sha }}
        run: python -B automation/scripts/restore_microcap_rebalance_recovery.py seal --root . --consumer-sha "$RUNTIME_SHA" --producer-sha "$PRODUCER_SHA" --plan scoped-recovery-plan.json --phase boundaries --out scoped-boundary-manifest.json
      - name: Preserve original R boundary recovery evidence
        if: steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-scoped-boundaries-v1-${{ steps.config.outputs.runtime_sha }}
          path: |
            scoped-boundary-manifest.json
            scoped-recovery-plan.json
            scoped-schedule.json
            scoped-restore.json
            scoped-latest-restore.json
            scoped-prepare/boundary-*.json
            scoped-prepare/preflight-*.json
            scoped-prepare/recovery-intent.json
            scoped-prepare/early-boundaries.json
            scoped-prepare/boundaries
          if-no-files-found: error
          retention-days: 90
      - name: Prepare current close sources for exactly 300 candidates
        if: steps.schedule.outputs.run == 'true' && steps.plan.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
        run: |
          args=()
          if [[ "${{ steps.resume.outputs.restored }}" == 'true' ]]; then args+=(--resume-state '${{ steps.resume.outputs.manifest }}'); fi
          python -B automation/scripts/run_microcap_scoped_rebalance.py prepare --consumer scoped-consumer --consumer-sha "$RUNTIME_SHA" --producer scoped-source-state/runtime --state scoped-source-state --pool scoped-weekly-roster/latest.json --date "$TARGET" --out scoped-prepare --warm-source-config automation/config/microcap_local_maintenance.json --recovery-plan scoped-recovery-plan.json "${args[@]}"
      - name: Restore previous daily member checkpoint
        if: steps.schedule.outputs.run == 'true' && steps.plan.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        env:
          PARENT_CEILING: ${{ steps.plan.outputs.parent_not_after_date }}
        run: |
          daily=$(python -c "import json;print(json.load(open('automation/config/microcap_member_runtime.json'))['strategy_sha'])")
          python -B automation/scripts/restore_microcap_member_checkpoint.py --strategy-sha "$daily" --seed-config automation/config/microcap_member_checkpoint.json --not-after-date "$PARENT_CEILING" --out scoped-previous > scoped-parent-restore.json
      - name: Earn original formal rebalance and next-session handoff
        if: steps.schedule.outputs.run == 'true' && steps.plan.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
        run: |
          args=()
          if [[ "${{ steps.resume.outputs.restored }}" == 'true' ]]; then args+=(--resume-state '${{ steps.resume.outputs.manifest }}'); fi
          python -B automation/scripts/run_microcap_scoped_rebalance.py deliver --consumer scoped-consumer --consumer-sha "$RUNTIME_SHA" --prepared scoped-prepare/prepared.json --current-checkpoint scoped-previous/checkpoint.json --date "$TARGET" --out scoped-delivery --recovery-plan scoped-recovery-plan.json "${args[@]}"
      - name: Describe verified scoped member checkpoint
        id: checkpoint
        if: steps.schedule.outputs.run == 'true' && steps.plan.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery')
        run: |
          daily=$(python -c "import json;print(json.load(open('automation/config/microcap_member_runtime.json'))['strategy_sha'])")
          name=$(python -B automation/scripts/restore_microcap_member_checkpoint.py --strategy-sha "$daily" --describe-checkpoint scoped-delivery/handoff/checkpoint.json)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Reconcile exact checkpoint publication before writing
        id: checkpoint_publication
        if: steps.plan.outputs.run == 'true'
        run: |
          daily=$(python -c "import json;print(json.load(open('automation/config/microcap_member_runtime.json'))['strategy_sha'])")
          python -B automation/scripts/restore_microcap_rebalance_recovery.py publication --kind checkpoint --checkpoint scoped-delivery/handoff/checkpoint.json --namespace-sha "$daily" --intent scoped-delivery/checkpoint-publication-intent.json --github-output "$GITHUB_OUTPUT"
      - name: Preserve checkpoint publication intent before upload
        if: steps.checkpoint_publication.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.checkpoint_publication.outputs.intent_artifact_name }}
          path: ${{ steps.checkpoint_publication.outputs.intent_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified member checkpoint
        if: steps.schedule.outputs.run == 'true' && steps.plan.outputs.run == 'true' && (inputs.task == 'rebalance' || inputs.task == 'rebalance_recovery') && steps.checkpoint_publication.outputs.should_publish == 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.checkpoint.outputs.name }}
          path: scoped-delivery/handoff/*
          if-no-files-found: error
          retention-days: 90
      - name: Pack verified scoped whole state
        if: steps.schedule.outputs.run == 'true' && (steps.plan.outputs.run == 'true' || steps.orphan.outputs.should_publish == 'true')
        env:
          TARGET: ${{ steps.schedule.outputs.date }}
          ORPHAN_PUBLISH: ${{ steps.orphan.outputs.should_publish }}
          ORPHAN_BUNDLE: ${{ steps.orphan.outputs.bundle }}
        run: |
          if [[ "$ORPHAN_PUBLISH" == 'true' ]]; then
            cp "$ORPHAN_BUNDLE" "$RUNNER_TEMP/microcap-whole-delivery-state.zip"
          else
            test -f scoped-delivery/formal-state.zip
            cp scoped-delivery/formal-state.zip "$RUNNER_TEMP/microcap-whole-delivery-state.zip"
          fi
      - name: Reconcile exact whole archive publication before writing
        id: whole_publication
        if: steps.plan.outputs.run == 'true'
        env:
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
        run: python -B automation/scripts/restore_microcap_rebalance_recovery.py publication --kind whole --bundle scoped-delivery/formal-state.zip --runtime-sha "$RUNTIME_SHA" --intent scoped-delivery/whole-publication-intent.json --github-output "$GITHUB_OUTPUT"
      - name: Preserve whole publication intent before upload
        if: steps.whole_publication.outputs.should_publish == 'true' || steps.orphan.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.orphan.outputs.intent_artifact_name || steps.whole_publication.outputs.intent_artifact_name }}
          path: ${{ steps.orphan.outputs.intent_file || steps.whole_publication.outputs.intent_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Publishable copy of verified restored archive
        if: steps.schedule.outputs.run == 'true' && inputs.task == 'scoped_acceptance'
        run: cp "$RUNNER_TEMP/restored-scoped-whole.zip" "$RUNNER_TEMP/microcap-whole-delivery-state.zip"
      - name: Publish verified scoped whole state
        if: steps.schedule.outputs.run == 'true' && (inputs.task == 'scoped_acceptance' || steps.whole_publication.outputs.should_publish == 'true' || steps.orphan.outputs.should_publish == 'true') && inputs.task != 'scoped_readback' && success()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-scoped-whole-v1-${{ steps.config.outputs.runtime_sha }}
          path: ${{ runner.temp }}/microcap-whole-delivery-state.zip
          if-no-files-found: error
          retention-days: 90
      - name: Seal resumable scoped recovery state
        id: sealed
        if: always() && steps.plan.outputs.run == 'true'
        env:
          RUNTIME_SHA: ${{ steps.config.outputs.runtime_sha }}
          PRODUCER_SHA: ${{ steps.config.outputs.producer_sha }}
        run: |
          python -B automation/scripts/restore_microcap_rebalance_recovery.py seal --root . --consumer-sha "$RUNTIME_SHA" --producer-sha "$PRODUCER_SHA" --plan scoped-recovery-plan.json --phase state --out scoped-recovery-manifest.json
          if [[ -f scoped-delivery/formal-state.zip ]]; then
            echo 'include_consumer=false' >> "$GITHUB_OUTPUT"
          else
            echo 'include_consumer=true' >> "$GITHUB_OUTPUT"
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Preserve resumable scoped recovery state
        if: always() && steps.sealed.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-scoped-resume-v1-${{ steps.config.outputs.runtime_sha }}
          path: |
            scoped-recovery-manifest.json
            scoped-recovery-plan.json
            scoped-schedule.json
            scoped-restore.json
            scoped-latest-restore.json
            scoped-parent-restore.json
            scoped-latest
            scoped-previous
            scoped-prepare
            scoped-delivery
            scoped-source-state/runs
            scoped-source-state/bootstrap.json
            scoped-source-state/reference-proxy.csv
            scoped-source-state/runtime/.microcap_index_cache
            ${{ steps.sealed.outputs.include_consumer == 'true' && 'scoped-consumer/.microcap_index_cache' || '' }}
            ${{ steps.sealed.outputs.include_consumer == 'true' && 'scoped-consumer/outputs' || '' }}
            !**/*.lock
            !scoped-delivery/publication-readback/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Preserve scoped maintenance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microcap-scoped-maintenance-${{ inputs.task }}
          path: |
            scoped-schedule.json
            scoped-recovery-plan.json
            scoped-latest-restore.json
            scoped-parent-restore.json
            scoped-boundary-manifest.json
            scoped-recovery-manifest.json
            scoped-resume/recovery-receipt.json
            scoped-orphan-publication
            !scoped-orphan-publication/publication-readback/**
            !scoped-delivery/publication-readback/**
            scoped-restore.json
            scoped-archive-acceptance.json
            ${{ runner.temp }}/scoped-whole-recovery-*/*.log
            ${{ runner.temp }}/scoped-whole-recovery-*/*.json
            scoped-source-state/runs
            scoped-source-state/bootstrap.json
            scoped-source-state/reference-proxy.csv
            scoped-prepare/commands
            scoped-prepare/receipts
            scoped-prepare/local-source-download.json
            scoped-prepare/prepared.json
            scoped-prepare/sources.zip
            scoped-prepare/consumer-config.json
            scoped-prepare/boundaries
            scoped-delivery
            ${{ steps.sealed.outputs.ready == 'true' && '!scoped-delivery/formal-state.zip' || '' }}
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve failed scoped producer sources
        if: (failure() || cancelled()) && steps.sealed.outputs.ready != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microcap-scoped-producer-recovery-${{ inputs.task }}
          path: |
            scoped-source-state/runtime/.microcap_index_cache
            scoped-source-state/bootstrap.json
            scoped-source-state/reference-proxy.csv
            !scoped-source-state/runtime/.microcap_index_cache/**/*.lock
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
