name: Weekly Equity Momentum Boundary Monitor

on:
  schedule:
    # 09:00 Asia/Shanghai every Monday. GitHub cron is UTC.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the validated weekly report through the existing daily-report mailer"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: monitoring/equity_momentum_boundary/requirements.txt

      - name: Install monitor dependencies
        run: python -m pip install -r monitoring/equity_momentum_boundary/requirements.txt

      - name: Run unit tests
        working-directory: monitoring/equity_momentum_boundary
        run: python -m unittest discover -p "test_*.py"

      - name: Build weekly report metadata
        run: python monitoring/equity_momentum_boundary/monitor.py --output-dir artifacts

      - name: Send through the existing daily-report mailer
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email != false }}
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python scripts/send_report.py artifacts/metadata.json

      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: equity-momentum-boundary-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
