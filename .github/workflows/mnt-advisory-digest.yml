name: MNT Advisory Digest

on:
  schedule:
    # 13:05 Asia/Shanghai == 05:05 UTC, after the MNT 12:45 advisory workflow.
    - cron: "5 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build MNT advisory digest
        run: python scripts/build_mnt_advisory_digest.py --out-dir artifacts --planned "13:05 Asia/Shanghai"
      - name: Send Gmail
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python scripts/send_report.py artifacts/metadata.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mnt-advisory-digest
          path: artifacts/
          retention-days: 30
