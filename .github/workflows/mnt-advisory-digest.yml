name: MNT Advisory Digest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record workflow start time
        run: echo "STARTED_BJ=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Check out automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Check out MNT repository
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/MNT
          ref: main
          path: mnt

      - name: Check out microcap repository
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: main
          path: microcap

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore generated market-data caches
        uses: actions/cache@v5
        with:
          path: |
            mnt/.cn_official_cache
            mnt/.cboe_cache
            mnt/.sse_510300_chain_cache
            mnt/.sse_option_stats_cache
          key: mnt-advisory-digest-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mnt-advisory-digest-${{ runner.os }}-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib xlsxwriter fastapi-poe

      - name: Build Microcap v2.0 source output
        id: microcap
        working-directory: microcap
        shell: bash
        run: |
          set +e
          timeout --foreground 35m python -u microcap_top100_mom16_biweekly_live_v2_0.py 2>&1 | tee ../microcap_v2_0_source_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Refresh five-sleeve source returns
        id: source_returns
        if: steps.microcap.outputs.exit_code == '0'
        working-directory: mnt
        shell: bash
        run: |
          set +e
          python quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/run_real_subd_v20_rebalance_validation.py 2>&1 | tee ../v76_level8_source_returns_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build portfolio and Level-8 advisory outputs
        id: build
        if: steps.microcap.outputs.exit_code == '0' && steps.source_returns.outputs.exit_code == '0'
        working-directory: mnt
        shell: bash
        run: |
          set +e
          {
            python build_v76_portfolio_nav.py
            python build_v76_level8_decision_dashboard.py
            python build_v76_level8_risk_governance.py
            python poe_v76_level8_advisory_bot.py
          } 2>&1 | tee ../v76_level8_advisory_outputs_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build MNT advisory digest
        if: always()
        run: |
          python automation/scripts/build_mnt_advisory_digest.py \
            --out-dir artifacts \
            --planned "11:30 Asia/Shanghai" \
            --summary-path mnt/outputs/portfolio_v76_current/level8_action_summary.md \
            --run-url "${GITHUB_RUN_URL}" \
            --microcap-exit-code "${{ steps.microcap.outputs.exit_code }}" \
            --source-returns-exit-code "${{ steps.source_returns.outputs.exit_code }}" \
            --build-exit-code "${{ steps.build.outputs.exit_code }}"

      - name: Send Gmail
        if: always()
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: python automation/scripts/send_report.py artifacts/metadata.json

      - name: Upload advisory outputs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mnt-advisory-digest
          path: |
            artifacts/
            microcap_v2_0_source_result.txt
            v76_level8_source_returns_result.txt
            v76_level8_advisory_outputs_result.txt
            mnt/outputs/portfolio_v76_current/**
          retention-days: 30
          if-no-files-found: warn

      - name: Add advisory result to job summary
        if: always()
        run: |
          {
            echo "## MNT Advisory Digest"
            echo
            echo "- Microcap v2.0 source exit code: ${{ steps.microcap.outputs.exit_code }}"
            echo "- Five-sleeve returns exit code: ${{ steps.source_returns.outputs.exit_code }}"
            echo "- Advisory build exit code: ${{ steps.build.outputs.exit_code }}"
            echo "- Artifact: mnt-advisory-digest"
            echo
            if [ -f mnt/outputs/portfolio_v76_current/level8_action_summary.md ]; then
              cat mnt/outputs/portfolio_v76_current/level8_action_summary.md
            else
              echo "Advisory output was not generated."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when advisory build failed
        if: steps.microcap.outputs.exit_code != '0' || steps.source_returns.outputs.exit_code != '0' || steps.build.outputs.exit_code != '0'
        run: exit 1
