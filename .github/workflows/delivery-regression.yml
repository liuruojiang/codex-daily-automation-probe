name: Delivery regression gate

on:
  pull_request:
    paths: ['.github/workflows/**', 'scripts/**', 'tests/**', 'cloudflare-workers/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**', 'tests/**', 'cloudflare-workers/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      family:
        type: string
        default: all
      recovery_strategy_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  member-daily-tests:
    # Exercise the actual member helper pin, independently of the legacy core
    # test-source role. This CI-only job is not a daily delivery dependency.
    if: ${{ inputs.family != 'icim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Resolve exact member daily runtime
        id: member
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          value=json.load(open('automation/config/microcap_member_runtime.json'))['strategy_sha']
          assert re.fullmatch('[0-9a-f]{40}',value)
          print('sha='+value)
          PY
      - uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: ${{ steps.member.outputs.sha }}
          path: member
          persist-credentials: false
      - run: python -m pip install numpy 'pandas<3' requests matplotlib 'akshare==1.18.46' 'pytest>=8,<9'
      - name: Test native member transport and next-session guards
        working-directory: member
        run: |
          python -B -X utf8 -m pytest -q -p no:cacheprovider \
            tests/test_member_daily_transport_20261109.py tests/test_stock_daily_alternative.py \
            tests/test_collect_member_daily_inputs.py tests/test_member_daily_signal.py \
            tests/test_member_period_handoff.py tests/test_member_split_replay_audit.py \
            tests/test_member_split_rebalance_audit.py --junitxml=member-daily-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: member-daily-regression-${{ github.run_id }}
          path: member/member-daily-tests.xml

  maintenance-native-tests:
    # Push/manual full regression only. Independent maintenance must not add a
    # dependency to either existing family-specific daily delivery gate.
    if: ${{ inputs.family != 'microcap' && inputs.family != 'icim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Resolve exact independent maintenance runtime
        id: maintenance
        run: |
          python - <<'PY'
          import json, os, re
          config = json.load(open('automation/config/microcap_maintenance_runtime.json'))
          assert re.fullmatch('[0-9a-f]{40}', config['runtime_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('sha=' + config['runtime_sha'] + '\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: ${{ steps.maintenance.outputs.sha }}
          path: maintenance
          persist-credentials: false
      - run: python -m pip install numpy 'pandas<3' requests 'akshare==1.18.46' matplotlib 'pytest>=8,<9'
      - name: Test real maintenance evidence and unchanged source guards
        working-directory: maintenance
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_maintenance_boundary_20261109.py tests/test_historical_share_close_20261109.py \
            tests/test_share_unchanged_tail_20261103.py tests/test_sse_share_daily_unchanged_20261104.py \
            tests/test_share_source_transport.py tests/exact_semantic_tail_source_cases_20261105.py \
            --junitxml=maintenance-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maintenance-native-regression-${{ github.run_id }}
          path: maintenance/maintenance-tests.xml

  automation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MICROCAP_RECOVERY_NATIVE_ROOT: ${{ github.workspace }}/native-recovery
      MICROCAP_LOCAL_READER_ROOT: ${{ github.workspace }}/local-reader
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read exact unchanged native kernel for recovery regression
        if: ${{ inputs.family != 'icim' }}
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: a7c1b9ac33454be4367880a0989dfc1466640503
          path: native-recovery
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /scripts/
            /data/
            /.gitattributes
            /tests/fixtures/exchange_sessions_20261015.json
      - name: Install recovery-kernel test imports
        if: ${{ inputs.family != 'icim' }}
        run: python -m pip install matplotlib 'akshare==1.18.46'
      - name: Read exact unchanged local reader for recovery-cache adversaries
        if: ${{ inputs.family != 'icim' }}
        uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: ab214c20d92ca9bbda1dde7e447bb153e7f59028
          path: local-reader
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/member_period_handoff.py
            /scripts/member_hedge_precision_bridge.py
            /.gitattributes
      - name: Read immutable pre-fix local-runner counterexample
        if: ${{ inputs.family != 'icim' }}
        run: |
          git fetch --no-tags --depth=1 origin eecf2c8fa7afb69426e9d8293517beb22f5a8c98
          git fetch --no-tags --depth=1 origin b8d489a7da1f09db5e48ebff387b7042f9508906
          git fetch --no-tags --depth=1 origin 5d27efb1986837b1b66083521ecf2ac543aaa650
      - run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'hypothesis>=6,<7' 'pandas<3' requests
      - name: Check delivery contracts and all automation regressions
        env:
          TEST_FAMILY: ${{ inputs.family || 'all' }}
        run: |
          case "${TEST_FAMILY}" in
            microcap) suites=(tests/test_microcap_*.py tests/test_v23_identity_adversarial.py tests/test_cn_publication_mode.py tests/test_delivery_regression_contract.py tests/test_cloudflare_dispatch_retry.py tests/test_restore_approved_microcap_state.py) ;;
            icim) suites=(tests/test_ic_im_v1_4_*.py tests/test_ic_im_v1_3_*.py tests/test_ic_im_r7_spread.py tests/test_cn_publication_mode.py tests/test_delivery_regression_contract.py tests/test_adversarial_delivery.py tests/test_cloudflare_dispatch_retry.py) ;;
            all) suites=(tests) ;;
            *) echo "Unknown test family"; exit 1 ;;
          esac
          python -B -X utf8 -m pytest -q -p no:cacheprovider "${suites[@]}" --junitxml=automation-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automation-regression-${{ github.run_id }}
          path: automation-tests.xml

  strategy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRATEGY_REPOSITORY: ${{ matrix.family == 'microcap' && 'liuruojiang/microcap' || 'liuruojiang/ic-im-rolling-arbitrage' }}
      STRATEGY_WORKFLOW: ${{ matrix.family == 'microcap' && 'microcap-realtime-digest.yml' || 'ic-im-v1-4-daily-digest.yml' }}
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.family == 'microcap' && '["microcap"]' || inputs.family == 'icim' && '["icim"]' || '["microcap","icim"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Resolve exact published strategy pin
        id: pin
        env:
          RECOVERY_STRATEGY_SHA: ${{ inputs.recovery_strategy_sha || '' }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          workflow = Path('automation/.github/workflows') / os.environ['STRATEGY_WORKFLOW']
          pattern = r'repository: ' + re.escape(os.environ['STRATEGY_REPOSITORY']) + r'\s+ref: ([0-9a-f]{40})\b'
          pins = set(re.findall(pattern, workflow.read_text(encoding='utf-8')))
          if len(pins) != 1:
              raise SystemExit('Expected exactly one consistent immutable strategy SHA')
          selected = pins.pop()
          config_path = 'automation/config/microcap_approved_state.json'
          candidate = os.environ.get('RECOVERY_STRATEGY_SHA', '')
          if candidate:
              if os.environ['STRATEGY_REPOSITORY'] != 'liuruojiang/microcap' or not re.fullmatch('[0-9a-f]{40}', candidate):
                  raise SystemExit('Invalid recovery-only regression candidate')
              config_path = 'automation/config/microcap_recovery_candidate.json'
              config = json.loads(Path(config_path).read_bytes())
              if config.get('strategy_sha') != candidate or config.get('daily_test_source', {}).get('runtime_sha') != candidate:
                  raise SystemExit('Recovery regression candidate/test role mismatch')
              selected = candidate
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('sha=' + selected + '\n')
              handle.write('config=' + config_path + '\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.STRATEGY_REPOSITORY }}
          ref: ${{ steps.pin.outputs.sha }}
          path: strategy
          persist-credentials: false
      - name: Install Microcap regression dependencies
        if: matrix.family == 'microcap'
        run: python -m pip install numpy 'pandas<3' requests 'akshare==1.18.46' matplotlib 'pytest>=8,<9' hypothesis
      - name: Install ICIM regression dependencies
        if: matrix.family == 'icim'
        run: python -m pip install -r strategy/requirements-poe-v1.4-server.txt 'pytest>=8,<9' hypothesis
      - name: Verify and materialize the separate complete Microcap test source
        if: matrix.family == 'microcap'
        run: |
          python -B -X utf8 automation/scripts/verify_microcap_daily_test_source.py materialize \
            --runtime-root strategy --config "${{ steps.pin.outputs.config }}" \
            --test-root strategy-tests --fetch-missing --out strategy/microcap-test-source.json
      - name: Test Microcap state and cloud transport invariants
        if: matrix.family == 'microcap'
        working-directory: strategy-tests
        env:
          MICROCAP_DIGEST_SOURCE: ${{ github.workspace }}/automation/scripts/build_microcap_realtime_digest.py
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          # Materialize a complete, hashed real v2.3 fixture only in this disposable strategy checkout.
          python -B -X utf8 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          automation = Path('../automation')
          fixture_root = automation / 'tests/fixtures/microcap/v23_identity_20261029'
          provenance = json.loads((fixture_root / 'fixture_provenance.json').read_text(encoding='utf-8'))
          if provenance['signal_date'] != '2026-10-28' or provenance['source']['post_signal_whole_check']['ok'] is not True:
              raise SystemExit('v2.3 real-output fixture provenance is not accepted')
          for entry in provenance['files'].values():
              source = automation / entry['fixture_path']
              destination = Path(entry['target_path'])
              if destination.exists():
                  raise SystemExit(f'refusing to overwrite disposable strategy output: {destination}')
              raw = source.read_bytes()
              if len(raw) != entry['size_bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256_raw']:
                  raise SystemExit(f'v2.3 real-output fixture hash mismatch: {source}')
              normalized = raw.replace(b'\r\n', b'\n')
              if hashlib.sha256(normalized).hexdigest() != entry['sha256_lf_normalized_manifest']:
                  raise SystemExit(f'v2.3 fixture does not match accepted whole manifest: {source}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)
          PY
          # Keep the complete existing delivery group; bound each independent group.
          timeout --foreground 600s python -B -X utf8 -m pytest -q -p no:cacheprovider \
            tests/test_realtime_preflight.py tests/test_realtime_state_guard_20260915.py \
            tests/test_top100_delivery.py tests/test_top100_cloud_delivery.py \
            tests/test_full_rebalance_cache_bundle.py tests/test_top100_data_guards.py \
            tests/test_adversarial_microcap_delivery.py tests/test_script_delivery_adversarial.py \
            tests/test_realtime_exchange_calendar.py tests/test_exchange_calendar_provider.py \
            tests/test_realtime_publication_deadline.py \
            tests/test_v20_plain_promotion.py tests/test_v23_plain_promotion.py tests/test_v25_plain_promotion.py tests/test_v23_no_overheat_promotion.py \
            tests/test_adversarial_v20_plain_20260904.py tests/test_adversarial_v23_plain_20260904.py \
            tests/test_adversarial_delivery_plain_20260904.py tests/test_adversarial_delivery_state_consistency.py \
            tests/test_v23_identity_adversarial.py tests/test_index_history_preflight.py \
            tests/test_panel_exchange_session_guard_20261012.py \
            tests/test_security_meta_current_st_history_resolution_20261012.py \
            tests/test_security_meta_preserve_20260917.py \
            tests/test_adversarial_recovery_boundaries_20261013.py \
            tests/test_cninfo_history_fail_closed_20261015.py \
            tests/test_exchange_session_completeness_20261015.py \
            tests/test_return_integrity_20261015.py \
            tests/test_security_meta_fail_closed_20261015.py \
            tests/test_v25_realtime_artifact_invalidation.py --junitxml=regression-core.xml
          timeout --foreground 600s python -B -X utf8 -m pytest -q -p no:cacheprovider \
            tests/test_share_change_source.py tests/test_share_source_transport.py tests/test_share_unchanged_tail_20261103.py tests/test_sse_share_daily_unchanged_20261104.py \
            tests/test_deferred_fixes_20261102.py tests/test_stock_return_basis.py tests/test_stock_return_basis_store.py \
            tests/test_stock_daily_alternative.py tests/test_same_day_notice_resume.py tests/test_dated_return_replay.py tests/test_scoped_cached_replay.py tests/test_st_replay_notice_horizon.py tests/test_frozen_tail_chain_20260917.py \
            tests/test_close_confirmation_1500_20261023.py \
            tests/test_realtime_quote_integrity_20261024.py \
            tests/test_st_notice_state_machine_20261024.py \
            tests/test_st_notice_release_audit_20261024.py \
            tests/test_exact_boundary_batch_20261103.py tests/test_postclose_boundary_transport_20261104.py \
            tests/test_realtime_commit_guard_20261024.py \
            tests/test_whole_delivery_member_cache_gate_20261024.py --junitxml=regression-release.xml
          timeout --foreground 180s python -B -X utf8 -m pytest -q -p no:cacheprovider \
            tests/test_source_closure_bounded.py tests/test_flow_state_independent.py \
            tests/test_st_history_scope_20261101.py tests/test_st_notice_incremental.py tests/test_st_notice_refresh.py \
            tests/test_st_notice_exact_inv_removal_20261104.py tests/test_csv_state_streaming.py \
            tests/test_release_batch.py tests/test_release_batch_independent.py \
            tests/test_validation_source_identity.py tests/test_validation_source_recertify.py \
            tests/test_validation_source_recertify_independent.py \
            tests/test_normal_source_receipt_transition.py tests/test_cloud_source_lineage_independent.py --junitxml=regression-flow.xml
          python -B -X utf8 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.Element('testsuites')
          for name in ('regression-core.xml', 'regression-release.xml', 'regression-flow.xml'):
              part = ET.parse(name).getroot()
              suites = [part] if part.tag == 'testsuite' else list(part)
              if not suites or not list(part.iter('testcase')):
                  raise SystemExit(f'Microcap mandatory group has no test cases: {name}')
              root.extend(suites)
          ET.ElementTree(root).write('regression.xml', encoding='utf-8', xml_declaration=True)
          skipped = list(root.iter('skipped'))
          if skipped:
              raise SystemExit(f'Microcap mandatory regression must have zero skips: {len(skipped)}')
          print(f"Microcap mandatory regression: {len(list(root.iter('testcase')))} tests, zero skips")
          PY
      - name: Test ICIM source failover and persistent ledger invariants
        if: matrix.family == 'icim'
        working-directory: strategy
        env:
          ICIM_STATE_DIR: ${{ runner.temp }}/icim-regression-state
          ICIM_REQUIRE_MIGRATION: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p data/ic_510500_put_proxy_validation_v1
          cp ../automation/tests/fixtures/icim/sina_000905_index.csv data/ic_510500_put_proxy_validation_v1/sina_000905_index.csv
          # Frozen official research fixture, inside this disposable test checkout.
          # The pytest environment still points to runner.temp, never a live ledger.
          test ! -e runtime/ic_im_v1_4_r1
          mkdir -p runtime
          cp -R ../automation/tests/fixtures/icim/v14_ledger_20261008 runtime/ic_im_v1_4_r1
          # Exact real r6/roll/calendar inputs for the unchanged historical
          # audits; verify their hashes before installing into this checkout.
          python -B -X utf8 ../automation/tests/fixtures/icim/quarter_roll_20261013/prepare_fixture.py --strategy-root .
          icim_gate_status=0
          timeout --foreground 65s python -B -X utf8 run_ic_im_v1_4_delivery_tests.py --out-dir daily-regression || icim_gate_status=$?
          if [[ "${icim_gate_status}" -ne 0 ]]; then
            if [[ -f daily-regression/process_output.txt ]]; then
              cat daily-regression/process_output.txt
            fi
            exit "${icim_gate_status}"
          fi
          cp daily-regression/regression.xml regression.xml
          # Preserve the additional historical/diagnostic coverage from the old cloud gate.
          timeout --foreground 60s python -B -X utf8 -m pytest -q -p no:cacheprovider \
            test_poe_ic_im_v1_3_state.py test_run_ic_im_v1_3_github_digest.py \
            test_external_review_fixes_20260911.py test_ic_im_month_spreads_20261018.py \
            quant_research_runs/20261018_monthly_spreads_adversarial_v1/data/test_independent_numeric_isolation.py \
            --junitxml=supplemental-regression.xml
          python -B -X utf8 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('regression.xml').getroot()
          assert not list(root.iter('skipped')), 'ICIM required regression must not skip'
          extra = ET.parse('supplemental-regression.xml').getroot()
          assert not list(extra.iter('skipped')), 'ICIM supplemental regression must not skip'
          PY
      - name: Verify Microcap test source bytes after execution
        if: always() && matrix.family == 'microcap'
        run: |
          python -B -X utf8 automation/scripts/verify_microcap_daily_test_source.py check-materialized \
            --receipt strategy/microcap-test-source.json --out strategy/microcap-test-source-after.json
      - name: Preserve tests and actual tested strategy SHA
        if: always()
        run: |
          git -C strategy rev-parse HEAD > strategy/tested-sha.txt
          if [[ "${{ matrix.family }}" == "microcap" ]]; then
            git -C strategy-tests rev-parse HEAD > strategy/tested-test-source-sha.txt
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: strategy-regression-${{ matrix.family }}-${{ github.run_id }}
          path: |
            strategy/regression.xml
            strategy/tested-sha.txt
            strategy/supplemental-regression.xml
            strategy/daily-regression/receipt.json
            strategy/daily-regression/process_output.txt
            strategy/daily-regression/regression.xml
            strategy/daily-regression/regression.txt
            strategy/daily-regression/test_run.json
            strategy/daily-regression/progress.jsonl
            strategy/daily-regression/collection.json
            strategy/daily-regression/source_before.json
            strategy/daily-regression/source_after.json
            strategy/microcap-test-source.json
            strategy/microcap-test-source-after.json
            strategy/tested-test-source-sha.txt
            strategy-tests/regression.xml
            strategy-tests/regression-core.xml
            strategy-tests/regression-release.xml
            strategy-tests/regression-flow.xml





