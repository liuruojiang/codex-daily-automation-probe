name: Microcap universe deadline probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
      - uses: actions/checkout@v6
        with:
          repository: liuruojiang/microcap
          ref: ad4de441d35442616f91aa613146ffdf8cd479f3
          path: microcap
          sparse-checkout: scripts/bounded_market_data.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas<3' 'akshare==1.18.46'
      - name: Probe only the failed universe provider
        run: python -B -u automation/scripts/probe_microcap_universe_deadline.py --source microcap/scripts/bounded_market_data.py --out artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: universe-deadline-probe
          path: artifacts/
          retention-days: 30
